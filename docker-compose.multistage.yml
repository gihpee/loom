services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    environment:
      LOOM_MODEL_CATALOG: /app/configs/catalog-tiny-shard.json
      LOOM_NODE_TOKEN: dev-token
      LOOM_REBALANCE_S: "30"
      LOOM_PARAM_MEM_RATIO: "0.6"
    ports: ["${LOOM_HTTP_PORT:-8010}:8000", "${LOOM_GRPC_PORT_EXT:-9010}:9000"]
    volumes:
      - /tmp/loom-shared-tiny:/models/tiny:ro
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.shard
    environment:
      LOOM_KEY: dev-token
      LOOM_ORCH_ADDR: orchestrator:9000
      LOOM_NODE_TOKEN: dev-token
      LOOM_DEVICE: cpu
      LOOM_MEMORY_GB: "0.0008"
      LOOM_TFLOPS_FP16: "10"
      LOOM_RSS_OVERHEAD_MB: "4096"
    depends_on: [orchestrator]
    volumes:
      - /tmp/loom-shared-tiny:/models/tiny:ro
