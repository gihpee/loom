[project]
name = "looma-connect"
version = "0.1.0"
description = "Локальный порт до Ray-кластера в Looma: клиент подключается к 127.0.0.1, а кластер живёт на машине, до которой нельзя дозвониться"
requires-python = ">=3.10"
# Одна зависимость, и это намеренно: утилита ставится клиенту, у которого нет
# ни репозитория, ни Docker, ни чего-либо ещё из Looma.
dependencies = ["websockets>=13"]

[project.scripts]
looma-connect = "looma_connect.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["looma_connect*"]

[tool.pytest.ini_options]
# Свой раздел, иначе pytest поднимается до корневого pyproject.toml и берёт
# настройки оркестратора — у которого этой строки нет, потому что асинхронных
# фикстур у него тоже нет.
#
# `auto`, а не декоратор на каждой: тут асинхронно всё, и один пропущенный
# `@pytest_asyncio.fixture` даёт не падение теста, а ошибку в внутренностях
# pytest, по которой не видно ни файла, ни причины.
asyncio_mode = "auto"
