[project]
name = "loom-ray"
version = "0.1.0"
description = "One rank of a Ray cluster, run as a Loom task"
requires-python = ">=3.10"
dependencies = ["ray>=2.9"]

[project.scripts]
loom-ray = "loom_ray.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loom_ray*"]
