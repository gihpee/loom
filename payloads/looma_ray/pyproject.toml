[project]
name = "looma-ray"
version = "0.1.0"
description = "One rank of a Ray cluster, run as a Looma task"
requires-python = ">=3.10"
dependencies = ["ray>=2.9"]

[project.scripts]
looma-ray = "looma_ray.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["looma_ray*"]
