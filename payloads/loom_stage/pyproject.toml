[project]
name = "loom-stage"
version = "0.1.0"
description = "One stage of a model pipeline, run as a Loom task"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
]

[project.scripts]
loom-stage = "loom_stage.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loom_stage*"]
