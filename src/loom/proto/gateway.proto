// Loom control gateway: the worker dials OUT to the orchestrator and keeps a
// single bidirectional stream open (hub-and-spoke, NAT-friendly). All logical
// WorkerControl commands travel orchestrator -> worker inside ControlMessage;
// acks/telemetry travel worker -> orchestrator inside WorkerMessage.
// worker_control.proto remains the canonical command contract.
//
// v0.2: the worker declares nothing by hand — hardware is auto-detected on the
// node, and authentication uses a join key issued by the orchestrator. The
// worker never needs a reachable address: inference is tunnelled back through
// its own outbound connection (see dataplane.proto).

syntax = "proto3";

package loom.control.v0;

import "worker_control.proto";

service ControlGateway {
  rpc Attach(stream WorkerMessage) returns (stream ControlMessage);
}

// Auto-detected on the worker (never hand-declared by the node owner).
message HardwareInfo {
  int32 num_gpus = 1;
  double tflops_fp16 = 2;
  string gpu_name = 3;            // e.g. "NVIDIA A100-SXM4-80GB"
  double memory_gb = 4;           // VRAM for cuda, unified RAM for mlx
  double memory_bandwidth_gbps = 5;
  string device = 6;              // "cuda" | "mlx" | "cpu"
  uint64 vram_free_bytes = 7;     // schedulable right now
  uint64 vram_total_bytes = 8;    // device total (used for backend quota math)
  double host_ram_gb = 9;
  string detection_source = 10;   // "nvml" | "torch" | "nvidia-smi" | "sysctl" | "env" | "fallback"
}

message RegisterRequest {
  string node_id = 1;
  // Join key issued by the orchestrator (`POST /admin/keys`). The key's secret
  // also becomes the per-node HMAC signing key for control commands.
  string join_key = 2;
  HardwareInfo hardware = 3;
  string region = 4;              // optional; declared by the operator or geo-derived
  string agent_version = 5;
}

message RegisterAck {
  bool ok = 1;
  string error = 2;
  // Node id assigned by the orchestrator (authoritative; the worker adopts it).
  string node_id = 3;
}

// Sent by the worker once a backend for model_id is up and answering locally.
// No host is reported: the orchestrator reaches it through the data-plane
// tunnel, keyed by (node_id, model_id).
message ServingEndpoint {
  string model_id = 1;
  uint32 local_port = 2;          // loopback port of the backend on the worker
  string command_id = 3;          // StartServing command that triggered it
}

message ControlMessage {
  oneof cmd {
    RegisterAck register_ack = 1;
    LoadShardRequest load_shard = 2;
    UnloadShardRequest unload_shard = 3;
    QuotaRequest set_quota = 4;
    ModelRequest start_serving = 5;
    ModelRequest stop_serving = 6;
    TelemetryRequest report_telemetry = 7;
    HeartbeatRequest heartbeat_probe = 8;
  }
}

message WorkerMessage {
  oneof msg {
    RegisterRequest register = 1;
    Ack ack = 2;
    TelemetryReport telemetry = 3;
    ServingEndpoint serving_endpoint = 4;
  }
}
