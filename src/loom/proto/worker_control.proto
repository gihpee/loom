// Loom control-plane contract: orchestrator -> worker push commands.
// Hub-and-spoke: the worker dials OUT to the orchestrator (mTLS) and serves
// these RPCs over the resulting channel; it contains no planning logic and
// executes commands without operator confirmation.
//
// RPC names are fixed per the v0 specification. Fields marked (phase 3) are
// reserved now so the wire format does not break when command signing and
// replay protection land.

syntax = "proto3";

package loom.control.v0;

service WorkerControl {
  rpc LoadShard(LoadShardRequest) returns (Ack);
  rpc UnloadShard(UnloadShardRequest) returns (Ack);
  rpc SetQuota(QuotaRequest) returns (Ack);
  rpc StartServing(ModelRequest) returns (Ack);
  rpc StopServing(ModelRequest) returns (Ack);
  rpc ReportTelemetry(TelemetryRequest) returns (TelemetryReport);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatAck);
}

// Envelope carried by every command for idempotency / replay protection.
message CommandMeta {
  string command_id = 1;        // UUID, worker deduplicates on it
  int64 issued_at_unix_ms = 2;  // (phase 3) rejected if outside freshness window
  bytes signature = 3;          // (phase 3) orchestrator signature over payload
}

message Ack {
  string command_id = 1;
  bool ok = 2;
  string error = 3;             // empty when ok
}

// Where this shard sits in a pipeline. A model whose layers do not fit on one
// GPU is served by several stages: stage 0 embeds and runs layers [0, k), the
// next stage continues from k, and the last stage runs the LM head and samples.
// One neighbour a stage may talk to directly, as the orchestrator knows it.
// This is the rendezvous half of NAT traversal: the orchestrator is the only
// party both peers trust and can always reach, so it is what tells each of
// them who the other is and where to try.
message PeerRoute {
  int32 stage_index = 1;        // which stage of this pipeline the peer runs
  string node_id = 2;
  string peer_id = 3;           // libp2p identity; empty = no direct path
  // Everything worth trying, best first: addresses the peer reported plus the
  // address the orchestrator OBSERVED on its control connection. The observed
  // one is the node's public address as the outside world sees it — the same
  // fact a STUN server would return, obtained for free from a connection the
  // node had to open anyway.
  repeated string addrs = 4;
  // What it costs THIS peer to reach the relay, as it last reported. Half of
  // the arithmetic that decides whether a direct link is worth using: the
  // relayed path costs my trip to the relay plus this one, and a node cannot
  // know the far half on its own.
  double relay_rtt_ms = 5;
}

message PipelineTopology {
  string pipeline_id = 1;       // groups the stages of one replica
  int32 stage_index = 2;        // 0-based position in the chain
  int32 num_stages = 3;         // 1 = the whole model on this node
  bool is_first = 4;            // owns embeddings + the client-facing request
  bool is_last = 5;             // owns the LM head + sampling
  int32 num_model_layers = 6;   // total decoder layers of the model
  // Every OTHER stage of this pipeline. A stage sends to stage_index+1 and the
  // last one sends the sampled token back to stage 0, so a full directory is
  // simpler than trying to guess which neighbours matter.
  repeated PeerRoute peers = 7;
}

message LoadShardRequest {
  string model_id = 1;
  int32 start_layer = 2;        // inclusive
  int32 end_layer = 3;          // exclusive
  string backend_type = 4;      // "vllm" | "sglang" | "mlx" | "shard"
  string weights_uri = 5;       // e.g. "hf://Qwen/Qwen3-0.6B" or an object-store URL
  uint64 vram_quota_bytes = 6;
  CommandMeta meta = 7;
  PipelineTopology topology = 8;
}

message UnloadShardRequest {
  string model_id = 1;
  CommandMeta meta = 2;
}

message QuotaRequest {
  string model_id = 1;
  uint64 vram_quota_bytes = 2;
  double compute_fraction = 3;  // 0..1 share of device compute (advisory in v0)
  CommandMeta meta = 4;
}

message ModelRequest {
  string model_id = 1;
  CommandMeta meta = 2;
}

message TelemetryRequest {
  // Empty in v0: orchestrator pulls a full report.
  CommandMeta meta = 1;
}

message ShardTelemetry {
  string model_id = 1;
  int32 start_layer = 2;
  int32 end_layer = 3;
  double avg_layer_latency_ms = 4;
  int32 current_requests = 5;
  bool healthy = 6;
  uint64 vram_used_bytes = 7;
  // Billing counters since the previous report window.
  uint64 tokens_in = 8;
  uint64 tokens_out = 9;
  double gpu_seconds = 10;
  // Shard lifecycle: "loading" | "loaded" | "serving" | "stopped" | "failed".
  // Lets the orchestrator distinguish a crash (failed -> self-heal) from a
  // shard that is still starting up.
  string status = 11;
  // Loopback port of the serving backend. Carried in every heartbeat so the
  // orchestrator can rebuild its endpoint table after a restart or any
  // desync, without waiting for a fresh StartServing.
  uint32 local_port = 12;
  // Pipeline role, so a restarted orchestrator can also rebuild the
  // stage-routing table for models split across nodes.
  string pipeline_id = 13;
  int32 stage_index = 14;
  int32 num_stages = 15;
}

message RttSample {
  string dst_node_id = 1;
  double rtt_ms = 2;
}

// A node's p2p state, on every heartbeat: who it is on the peer network and
// how its traffic actually travelled.
//
// Identity rides here, not only in RegisterRequest, because a worker learns
// where the rendezvous is FROM the registration ack — so at the moment it
// registers it has no peer id yet. Repeating it on every heartbeat also means
// an orchestrator that restarts re-learns the whole peer directory within one
// heartbeat, the same way it re-learns which shards are running.
//
// The counters matter because the direct path degrades silently: a deployment
// that quietly fell back to the relay looks identical to a working one apart
// from the latency.
message PeerStatus {
  string peer_id = 1;               // empty when this node has no p2p stack
  repeated string listen_addrs = 2;
  bool symmetric_nat = 3;           // hole punching to this node cannot work
  uint64 direct = 4;                // messages sent straight to a peer
  uint64 relayed = 5;               // messages sent through the orchestrator
  uint64 fallbacks = 6;             // direct link failed, the relay saved it
  double direct_share = 7;
  // Addresses AutoNAT confirmed are reachable from outside. Empty means no
  // peer can open a direct link TO this node — it can still open one itself.
  repeated string visible_addrs = 8;
  // Links libp2p reported as established but which cost more to use than
  // relaying: circuits through the relay, mostly. Counted rather than hidden,
  // because "0% direct" means something entirely different when the direct
  // path was rejected on purpose than when it never came up.
  uint64 not_worth = 9;
  double link_rtt_ms = 10;          // to the neighbour, over libp2p
  double relay_rtt_ms = 11;         // to the relay: the yardstick
}

message TelemetryReport {
  string node_id = 1;
  repeated ShardTelemetry shards = 2;
  repeated RttSample rtts = 3;
  uint64 vram_free_bytes = 4;
  int64 reported_at_unix_ms = 5;
  PeerStatus peer = 6;
}

message HeartbeatRequest {
  CommandMeta meta = 1;
}

message HeartbeatAck {
  string node_id = 1;
  int64 unix_ms = 2;
  // Lightweight liveness payload so Phase-2 can degrade gracefully between
  // full telemetry pulls.
  repeated ShardTelemetry shards = 3;
}
