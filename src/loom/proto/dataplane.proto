// Loom data plane: inference traffic tunnelled through the worker's OWN
// outbound connection.
//
// Why: a private GPU owner sits behind NAT and must not be required to expose
// any port or configure an advertise address. The worker opens a second
// outbound bidi stream ("tunnel"); the orchestrator pushes HTTP requests into
// it, the worker relays them to its local backend on 127.0.0.1 and streams the
// response back. Same idea as Parallax relaying traffic over already-open P2P
// connections, expressed in our hub-and-spoke model.
//
// Multiplexing: many concurrent requests share one stream, correlated by
// request_id. Streaming responses arrive as ordered chunks terminated by End.

syntax = "proto3";

package loom.data.v0;

service DataPlane {
  rpc Tunnel(stream TunnelMessage) returns (stream TunnelMessage);
}

// worker -> orchestrator, first message on the stream.
message TunnelHello {
  string node_id = 1;
  string join_key = 2;
}

message TunnelHelloAck {
  bool ok = 1;
  string error = 2;
}

// orchestrator -> worker
message HttpRequest {
  string request_id = 1;
  string model_id = 2;          // resolves to the local backend port
  string method = 3;            // "POST" | "GET"
  string path = 4;              // e.g. "/v1/chat/completions"
  bytes body = 5;
  map<string, string> headers = 6;
  bool stream = 7;              // relay chunks as they arrive
  uint32 timeout_s = 8;
}

// worker -> orchestrator
message HttpResponseHead {
  string request_id = 1;
  uint32 status = 2;
  map<string, string> headers = 3;
}

message HttpBodyChunk {
  string request_id = 1;
  bytes data = 2;
}

message HttpEnd {
  string request_id = 1;
}

message HttpError {
  string request_id = 1;
  string error = 2;
}

// orchestrator -> worker: abandon an in-flight request (client disconnected).
message HttpCancel {
  string request_id = 1;
}

// ---------------------------------------------------------------- pipeline
// Inter-stage traffic for a model split across several nodes.
//
// A decode step travels the chain: stage 0 -> stage 1 -> ... -> last stage,
// then the sampled token goes straight back to stage 0, which streams it to
// the client and starts the next step. Every hop is relayed by the
// orchestrator through the stages' existing outbound tunnels, so no worker
// needs to be reachable by any other worker.
enum StageKind {
  STAGE_KIND_UNSPECIFIED = 0;
  ACTIVATIONS = 1;   // hidden states for the next stage
  TOKEN = 2;         // sampled token id, sent from the last stage to the head
  FREE = 3;          // release per-request KV state on every stage
  STAGE_ERROR = 4;   // a stage failed; abort the request
}

message StageEnvelope {
  string pipeline_id = 1;
  string model_id = 2;
  string request_id = 3;      // per client request; keys the KV cache on each stage
  int32 target_stage = 4;     // stage that must process this message
  int32 from_stage = 5;
  StageKind kind = 6;
  int32 step = 7;             // 0 = prefill, then one per generated token

  // Payload for ACTIVATIONS: raw tensor bytes plus its shape/dtype.
  bytes tensor = 8;
  repeated int32 shape = 9;
  string dtype = 10;          // e.g. "float32", "bfloat16"

  // Payload for TOKEN.
  int32 token_id = 11;
  bool finished = 12;         // last stage says generation is done
  string finish_reason = 13;

  // Positions of the tokens carried by this step (needed by RoPE/KV on every
  // stage, since only the head knows the real sequence layout).
  repeated int32 positions = 14;

  string error = 15;          // for STAGE_ERROR

  // --- timing instrumentation -------------------------------------------
  // DURATIONS, not timestamps: the stages live on different machines, and
  // subtracting clocks that are only NTP-close would put the measurement
  // error inside the very number we are trying to read. Each stage reports
  // how long IT spent, the head measures the round trip it can see, and
  // transport falls out as the difference.
  double compute_ms = 16;   // this stage's forward for this step
  double upstream_ms = 17;  // compute already accounted for by earlier stages
  int32 hops = 18;          // stages this message has passed through
}

message TunnelMessage {
  oneof msg {
    TunnelHello hello = 1;
    TunnelHelloAck hello_ack = 2;
    HttpRequest request = 3;
    HttpResponseHead head = 4;
    HttpBodyChunk chunk = 5;
    HttpEnd end = 6;
    HttpError error = 7;
    HttpCancel cancel = 8;
    StageEnvelope stage = 9;
  }
}
