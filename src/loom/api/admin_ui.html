<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loom Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#d7dce4; --dim:#8b93a1;
          --ok:#4cc38a; --warn:#e5c454; --bad:#e5636e; --acc:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; color:var(--acc); }
  nav button { background:none; border:1px solid transparent; color:var(--dim);
               padding:6px 10px; cursor:pointer; font:inherit; border-radius:6px; }
  nav button.active { color:var(--fg); border-color:var(--line); background:var(--panel); }
  #token { background:var(--panel); border:1px solid var(--line); color:var(--fg);
           padding:5px 8px; border-radius:6px; width:150px; font:inherit; }
  main { padding:16px; max-width:1200px; }
  table { border-collapse:collapse; width:100%; margin:8px 0 20px; }
  th, td { border:1px solid var(--line); padding:5px 9px; text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:normal; background:var(--panel); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .dim { color:var(--dim); } .acc { color:var(--acc); }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  select, textarea, input[type=text] { background:var(--panel); border:1px solid var(--line);
           color:var(--fg); padding:6px 8px; border-radius:6px; font:inherit; }
  textarea { width:100%; min-height:70px; }
  button.action { background:var(--acc); color:#0b0d10; border:none; padding:7px 14px;
                  border-radius:6px; cursor:pointer; font:inherit; font-weight:600; }
  button.danger { background:var(--bad); }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:6px;
        padding:10px; white-space:pre-wrap; word-break:break-word; }
  .muted { color:var(--dim); font-size:12px; }
  #err { color:var(--bad); margin-left:auto; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .field { display:flex; flex-direction:column; gap:3px; }
  .field > span { color:var(--dim); font-size:11px; text-transform:uppercase;
                  letter-spacing:.06em; }
  .field input, .field select { min-width:0; }
  .stage { border:1px solid var(--line); border-radius:6px; padding:8px 10px;
           margin:6px 0; background:var(--panel); }
  .stage .head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .bar { height:3px; background:var(--line); border-radius:2px; margin-top:6px; }
  .bar > i { display:block; height:100%; background:var(--acc); border-radius:2px; }
  .hint { color:var(--dim); font-size:12px; margin:4px 0 12px; }
  input[type=file] { color:var(--dim); font:inherit; }
</style>
</head>
<body>
<header>
  <h1>loom admin</h1>
  <nav id="tabs"></nav>
  <span class="muted">token:</span>
  <input id="token" type="password" placeholder="admin token">
  <span class="muted" id="refreshed"></span>
  <span id="err"></span>
</header>
<main id="view"></main>
<script>// Loom admin. Four things an operator does: watch nodes, run work, hand out
// join keys, roll out a new agent. Everything else belongs in the API.
const $ = (s) => document.querySelector(s);
let active = localStorage.getItem("loom_tab") || "Nodes";
let timer = null;
let message = "";
let deployBusy = false;
let taskLogs = "select «logs» on a task";

function headers() {
  const token = $("#token").value.trim();
  return token ? {"Content-Type": "application/json", "X-Loom-Admin-Token": token}
               : {"Content-Type": "application/json"};
}

async function api(path, opts) {
  opts = Object.assign({}, opts || {});
  // A result file is bytes, not JSON, and it cannot be a plain <a href>
  // because the admin token travels in a header.
  const raw = opts.raw; delete opts.raw;
  const r = await fetch(path, Object.assign({headers: headers()}, opts));
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    throw new Error(body.error ? body.error.message : r.status);
  }
  return raw ? await r.blob() : await r.json();
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gb = (bytes) => (Number(bytes || 0) / 1073741824).toFixed(1);
const stateCls = (s) => ({running:"ok", done:"ok", provisioning:"warn", pending:"warn",
                          failed:"bad", cancelled:"dim", gone:"dim"}[s] || "dim");

function table(cols, rows) {
  if (!rows.length) return `<p class="dim">nothing here yet</p>`;
  return `<table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>` +
    rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + `</table>`;
}

// ------------------------------------------------------------------- nodes
async function viewNodes() {
  const nodes = (await api("/admin/agents")).nodes || [];
  const connect = await api("/admin/connect").catch(() => ({}));
  const rows = nodes.map(n => [
    `${esc(n.node_id)}<br><span class="dim">agent ${esc(n.agent_version)}</span>`,
    esc(n.gpu_name || n.device || "—"),
    `${n.gpus_free} / ${n.gpus_total}`,
    `${gb(n.vram_free_bytes)} GB`,
    n.accepts_tasks
      ? `<span class="ok">takes work</span><br><span class="dim">${esc((n.environment_kinds||[]).join(", "))}</span>`
      : `<span class="bad">refuses</span><br><span class="dim">${esc(n.refusal)}</span>`,
    `${n.tasks_running} running<br><span class="dim">env cache ${gb(n.env_cache_bytes)} GB</span>`,
    peerCell(n),
    `<span class="dim">${n.seconds_since_seen}s ago</span>`,
  ]);
  const warn = connect.severity === "warn"
    ? `<p class="bad">${esc(connect.warning || "nodes may not be able to reach this address")}</p>` : "";
  return `
  <h2>Nodes</h2>
  ${table(["node","hardware","gpus free","vram","state","load","путь к соседям","seen"], rows)}
  <h2>How a machine joins</h2>
  <p class="dim">Address nodes dial: <b>${esc(connect.dial_address || "unknown")}</b>
     <span class="dim">(${esc(connect.source || "—")})</span></p>
  ${warn}
  <p class="dim">Issue a key on the Keys tab; it carries this address, so the owner
     passes one string and nothing else.</p>`;
}

// -------------------------------------------------------------------- work
async function viewWork() {
  const tasks = (await api("/admin/tasks")).tasks || [];
  const groups = (await api("/admin/groups")).groups || [];
  const nodes = (await api("/admin/agents")).nodes || [];

  const groupRows = groups.map(g => [
    `${esc(g.group_id)}${g.label ? `<br><span class="acc">${esc(g.label)}</span>` : ""}`,
    g.size,
    g.ranks.map(r => `<span class="dim">${r.rank}:</span> ${esc(r.node_id)}`).join("<br>"),
    `<button onclick="stopGroup('${g.group_id}')">stop</button>`,
  ]);

  const taskRows = tasks.map(t => {
    const results = (t.results || []).map(f =>
      `<a href="#" onclick="download('${t.task_id}','${esc(f.name)}');return false">${esc(f.name)}</a>` +
      ` <span class="dim">${(f.size_bytes/1024).toFixed(1)} KB</span>`).join("<br>")
      || `<span class="dim">—</span>`;
    const done = ["done","failed","cancelled","gone"].includes(t.state);
    return [
      `${esc(t.task_id)}<br><span class="dim">${esc(t.node_id)}${t.group_id ? ` · rank ${t.rank}` : ""}</span>`,
      `<span class="dim">${esc((t.command || []).join(" ").slice(0, 70))}</span>`,
      `<span class="${stateCls(t.state)}">${esc(t.state)}</span>` +
        (t.error ? `<br><span class="dim">${esc(t.error)}</span>` : ""),
      `${t.seconds}s` + ((t.devices||[]).length ? `<br><span class="dim">gpu ${t.devices.join(",")}</span>` : ""),
      results,
      `<button onclick="showLogs('${t.task_id}')">logs</button> ` +
        (done ? `<button onclick="forget('${t.task_id}')">remove</button>`
              : `<button onclick="stopTask('${t.task_id}')">stop</button>`),
    ];
  });

  const free = nodes.filter(n => n.accepts_tasks).length;
  return `
  <h2>Run a task</h2>
  <div class="row">
    <input id="t-cmd" type="text" placeholder='python -c "print(1)"' style="min-width:340px">
    <input id="t-reqs" type="text" placeholder="dependencies: numpy, pillow" style="min-width:200px">
    <input id="t-gpus" type="text" value="0" title="gpus" style="width:60px">
    <input id="t-timeout" type="text" value="600" title="timeout, s" style="width:80px">
    <input id="t-file" type="file" title="input file">
    <button class="action" onclick="runTask()">run</button>
  </div>
  <p class="muted">${free} of ${nodes.length} nodes take work. The file lands in the task's
     working directory; the result is whatever it writes to $LOOM_TASK_OUT.</p>
  ${message ? `<pre>${esc(message)}</pre>` : ""}
  <h2>Groups</h2>
  ${table(["group","size","ranks",""], groupRows)}
  <h2>Tasks</h2>
  ${table(["task","command","state","time","result",""], taskRows)}
  <h2>Logs</h2>
  <pre id="t-logs">${esc(taskLogs)}</pre>`;
}

async function runTask() {
  const command = $("#t-cmd").value.trim();
  if (!command) { message = "a task needs a command"; return render(); }
  const reqs = $("#t-reqs").value.split(/[,\s]+/).filter(Boolean);
  const body = {
    command: splitCommand(command),
    timeout_s: parseInt($("#t-timeout").value, 10) || 3600,
    resources: {gpus: parseInt($("#t-gpus").value, 10) || 0},
    environment: reqs.length ? {kind: "python", requirements: reqs} : {kind: "none"},
  };
  const file = $("#t-file").files[0];
  if (file) {
    const raw = new Uint8Array(await file.arrayBuffer());
    let binary = ""; raw.forEach(b => binary += String.fromCharCode(b));
    body.inputs = {[file.name]: btoa(binary)};
  }
  try {
    const r = await api("/admin/tasks", {method:"POST", body: JSON.stringify(body)});
    message = `task ${r.task_id} placed on ${r.node_id}`;
  } catch (e) { message = "not accepted: " + e.message; }
  render();
}

const act = (path, opts) => api(path, opts).catch(e => { message = e.message; }).then(render);
const stopTask = (id) => act("/admin/tasks/" + id + "/stop", {method:"POST"});
const forget = (id) => act("/admin/tasks/" + id, {method:"DELETE"});
const stopGroup = (id) => act("/admin/groups/" + id + "/stop", {method:"POST"});

async function showLogs(id) {
  try { taskLogs = (await api("/admin/tasks/" + id + "/logs?tail=200")).text || "(empty)"; }
  catch (e) { taskLogs = "no logs: " + e.message; }
  render();
}

function download(id, name) {
  api(`/admin/tasks/${id}/results/${encodeURIComponent(name)}`, {raw: true})
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name.split("/").pop();
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    })
    .catch(e => { message = "could not collect: " + e.message; render(); });
}

// -------------------------------------------------------------------- keys
async function viewKeys() {
  const keys = (await api("/admin/keys")).keys || [];
  const rows = keys.map(k => [
    esc(k.key_id), esc(k.label || "—"),
    `${k.nodes_joined ?? 0}${k.max_nodes ? " / " + k.max_nodes : ""}`,
    `<button onclick="revokeKey('${k.key_id}')">revoke</button>`,
  ]);
  return `
  <h2>Issue a join key</h2>
  <div class="row">
    <input id="k-label" type="text" placeholder="label, e.g. misha's 4090" style="min-width:220px">
    <input id="k-max" type="text" value="0" title="max nodes, 0 = unlimited" style="width:80px">
    <button class="action" onclick="issueKey()">issue</button>
  </div>
  ${message ? `<pre>${esc(message)}</pre>` : ""}
  <h2>Keys</h2>
  ${table(["id","label","nodes",""], rows)}`;
}

async function issueKey() {
  try {
    const r = await api("/admin/keys", {method:"POST", body: JSON.stringify(
      {label: $("#k-label").value, max_nodes: parseInt($("#k-max").value, 10) || 0})});
    message = "On the GPU machine, ONE command:\n\n" +
      `docker run -d --gpus all --restart unless-stopped --network host \\\n` +
      `  -v loom-data:/var/lib/loom ${r.agent_image} --key ${r.key}\n\n` +
      `(the orchestrator address ${r.address} is already inside the key)`;
  } catch (e) { message = "error: " + e.message; }
  render();
}

const revokeKey = (id) => act("/admin/keys/" + id, {method:"DELETE"});

// ----------------------------------------------------------------- release
async function viewRelease() {
  const map = await api("/admin/release");
  const rel = map.release;
  const versions = Object.entries(map.versions || {}).sort((a, b) => b[1] - a[1])
    .map(([v, n]) => [esc(v), n, ((n / (map.nodes_total || 1)) * 100).toFixed(0) + "%"]);
  const state = rel ? `
    <p>Release <b>${esc(rel.version)}</b> · ${(rel.size_bytes/1048576).toFixed(1)} MB ·
       rollout <b>${rel.wave_percent}%</b><br>
       <span class="dim">${map.nodes_in_wave} nodes in the wave,
       ${map.nodes_on_target} of ${map.nodes_total} already on it</span></p>
    <div class="row">
      <button onclick="setWave(10)">10%</button>
      <button onclick="setWave(25)">25%</button>
      <button onclick="setWave(50)">50%</button>
      <button onclick="setWave(100)">whole fleet</button>
      <button class="danger" onclick="withdraw()">stop rollout</button>
    </div>
    <p class="muted">A node's wave is decided by its name, not by chance, so it stays in
    the same one across reconnects. Waves are advanced by hand: "registered" and "works"
    are not the same thing, and an automatic step would spread a broken build
    confidently.</p>` : `<p class="dim">Nothing published.</p>`;
  return `
  <h2>Agent rollout</h2>
  ${state}
  ${message ? `<pre>${esc(message)}</pre>` : ""}
  <h2>Versions in the fleet</h2>
  ${table(["version","nodes","share"], versions)}
  <h2>Publish</h2>
  <div class="row">
    <input id="r-version" type="text" placeholder="0.2.0" style="width:110px">
    <input id="r-sig" type="text" placeholder="signature, hex" style="min-width:320px">
    <input id="r-file" type="file" accept=".gz,.tgz">
    <button class="action" onclick="publish()">publish</button>
  </div>
  <p class="muted">Signed with a key this orchestrator does not have and must not: taken
  over, it can name a release we already signed, but not run new code on the fleet.
  Publishing does not start a rollout.</p>`;
}

async function publish() {
  const file = $("#r-file").files[0];
  const version = $("#r-version").value.trim();
  const signature = $("#r-sig").value.trim();
  if (!file || !version || !signature) { message = "version, signature and archive"; return render(); }
  const raw = new Uint8Array(await file.arrayBuffer());
  let binary = ""; raw.forEach(b => binary += String.fromCharCode(b));
  try {
    const r = await api("/admin/release", {method:"POST", body: JSON.stringify(
      {version, signature, archive: btoa(binary)})});
    message = `release ${r.version} published, rollout at 0%`;
  } catch (e) { message = "not accepted: " + e.message; }
  render();
}

const setWave = (percent) => act("/admin/release/wave",
  {method:"POST", body: JSON.stringify({percent})});
const withdraw = () => act("/admin/release/withdraw", {method:"POST"});


function peerCell(n) {
  // «Конвейер тормозит» и «всё едет через оркестратор» снаружи выглядят
  // одинаково. Различает их только это.
  if (!n.peer_id) return `<span class="dim">без p2p</span>`;
  const total = (n.direct || 0) + (n.relayed || 0);
  const how = n.symmetric_nat ? `<span class="warn">symmetric NAT</span>`
            : n.reachable ? `<span class="ok">дозвонимый</span>`
            : `<span class="warn">только через реле</span>`;
  return how + (total
    ? `<br><span class="dim">${Math.round((n.direct_share || 0) * 100)}% прямо · ` +
      `${total} сообщ.${n.link_rtt_ms ? ` · ${n.link_rtt_ms} ms` : ""}</span>`
    : `<br><span class="dim">обмена ещё не было</span>`);
}

// ------------------------------------------------------------------ models
let deployMsg = "";
let chatOut = "";
let chatBusy = false;
let health = {};        // group_id -> что ответили стадии

function field(label, html) {
  return `<label class="field"><span>${label}</span>${html}</label>`;
}

// Что стадия делает прямо сейчас. "running" — это про процесс, а не про
// готовность: веса грузятся минутами, и всё это время задача выглядит
// одинаково.
function stagePhase(s) {
  if (s.state === "pending") return ["ждёт очереди", 5];
  if (s.state === "provisioning") return ["ставит окружение и качает веса", 25];
  if (s.state === "failed") return ["упала", 100];
  if (s.state === "cancelled") return ["снята", 100];
  if (s.state !== "running") return [s.state, 0];
  if (!s.stage) return ["поднимается", 55];
  return s.ready ? ["готова", 100] : ["грузит веса", 75];
}

async function viewModels() {
  const groups = (await api("/admin/groups")).groups || [];
  const nodes = (await api("/admin/agents")).nodes || [];
  const serving = new Set(((await api("/v1/models")).data || []).map(m => m.id));
  const deployed = groups.filter(g => g.label);

  for (const g of deployed) {
    if (!serving.has(g.label) || !health[g.group_id]) {
      health[g.group_id] = await api(`/admin/groups/${g.group_id}/health`).catch(() => null);
    }
  }

  const cards = deployed.map(g => {
    const h = health[g.group_id];
    const stages = (h?.stages || g.ranks.map(r => ({...r, state: "?"}))).map(s => {
      const [phase, pct] = stagePhase(s);
      const layers = s.stage?.layers;
      return `<div class="stage">
        <div class="head">
          <b>ранг ${s.rank}</b>
          <span class="dim">${esc(s.node_id)}</span>
          ${layers ? `<span class="dim">слои [${layers[0]}, ${layers[1]})</span>` : ""}
          <span class="${s.ready ? "ok" : s.state === "failed" ? "bad" : "warn"}">${esc(phase)}</span>
          ${s.seconds ? `<span class="dim">${s.seconds}s</span>` : ""}
        </div>
        ${s.error ? `<div class="dim">${esc(s.error)}</div>` : ""}
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>`;
    }).join("");
    const up = serving.has(g.label);
    return `<div style="margin-bottom:18px">
      <div class="head" style="display:flex;gap:12px;align-items:baseline">
        <b class="acc" style="font-size:15px">${esc(g.label)}</b>
        <span class="${up ? "ok" : "warn"}">${up ? "отвечает" : "поднимается"}</span>
        <span class="dim">${g.size} ${g.size === 1 ? "стадия" : "стадии"}</span>
        <button onclick="stopGroup('${g.group_id}')">снять</button>
        ${up ? `<button onclick="useModel('${esc(g.label)}')">спросить</button>` : ""}
      </div>
      ${stages}
    </div>`;
  }).join("") || `<p class="dim">пока ничего не развёрнуто</p>`;

  const options = nodes.filter(n => n.accepts_tasks).map(n =>
    `<option value="${esc(n.node_id)}">${esc(n.node_id)} · ${gb(n.vram_free_bytes)} GB своб.</option>`
  ).join("");

  return `
  <h2>Развернуть модель</h2>
  <div class="row">
    ${field("модель на huggingface", `<input id="m-repo" type="text" placeholder="Qwen/Qwen3-8B" style="width:240px">`)}
    ${field("имя для клиентов", `<input id="m-label" type="text" placeholder="по умолчанию — хвост" style="width:190px">`)}
    ${field("точность", `<select id="m-dtype"><option>bfloat16</option><option>float16</option><option>float32</option></select>`)}
    ${field("устройство", `<select id="m-device"><option>cuda</option><option>cpu</option></select>`)}
    ${field("\u00a0", `<button onclick="describeModel()">сколько слоёв</button>`)}
  </div>
  <div class="row">
    ${field("узлы — пусто = самые свободные",
            `<select id="m-nodes" multiple size="3" style="min-width:300px">${options}</select>`)}
    ${field("стадий", `<input id="m-stages" type="text" value="2" style="width:60px">`)}
    ${field("разрез", `<label class="dim" style="padding:6px 0">
        <input type="checkbox" id="m-byvram" checked> по свободной VRAM</label>`)}
    ${field("\u00a0", `<button class="action" onclick="deploy()">развернуть</button>`)}
  </div>
  <p class="hint">Веса качает сама стадия и только свой кусок. Первый запуск на узле —
  минуты: ставится окружение и качаются веса. Второй — из кэша.</p>
  ${deployMsg ? `<pre>${esc(deployMsg)}</pre>` : ""}
  <h2>Развёрнуто</h2>
  ${cards}
  <h2>Проверить</h2>
  <div class="row">
    ${field("модель", `<input id="c-model" type="text" style="width:170px">`)}
    ${field("вопрос", `<input id="c-text" type="text" placeholder="привет" style="width:340px">`)}
    ${field("макс. токенов", `<input id="c-max" type="text" value="128" style="width:90px">`)}
    ${field("\u00a0", `<button class="action" onclick="ask()">${chatBusy ? "…" : "спросить"}</button>`)}
  </div>
  <pre id="c-out">${esc(chatOut || "ответ появится здесь, по мере генерации")}</pre>`;
}

function useModel(label) {
  active = "Models";
  render().then(() => { const f = $("#c-model"); if (f) { f.value = label; f.focus(); } });
}

async function describeModel() {
  try {
    const m = await api("/admin/models/describe",
                        {method:"POST", body: JSON.stringify({repo: $("#m-repo").value.trim()})});
    deployMsg = `${m.repo}: ${m.num_layers} слоёв, ${m.architecture || "архитектура не указана"}`;
  } catch (e) { deployMsg = e.message; }
  render();
}

async function deploy() {
  const selected = Array.from($("#m-nodes").selectedOptions).map(o => o.value);
  const body = {
    repo: $("#m-repo").value.trim(),
    label: $("#m-label").value.trim() || undefined,
    dtype: $("#m-dtype").value,
    device: $("#m-device").value,
    by_vram: $("#m-byvram").checked,
  };
  if (selected.length) body.node_ids = selected;
  else body.stages = parseInt($("#m-stages").value, 10) || 1;
  deployMsg = "отправляем…"; render();
  try {
    const r = await api("/admin/deploy", {method:"POST", body: JSON.stringify(body)});
    deployMsg = `${r.label}: ${r.model.num_layers} слоёв разрезаны так —\n` +
      r.split.map(s => `  ранг ${s.rank}: слои [${s.start_layer}, ${s.end_layer}) на ${s.node_id}`).join("\n");
    health = {};
  } catch (e) { deployMsg = "не принято: " + e.message; }
  render();
}

async function ask() {
  const model = $("#c-model").value.trim();
  const text = $("#c-text").value.trim();
  if (!model || !text) { chatOut = "нужны модель и вопрос"; return render(); }
  chatBusy = true; chatOut = ""; render();
  const started = Date.now();
  let tokens = 0, first = null;
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({model, stream: true,
                            messages: [{role: "user", content: text}],
                            max_tokens: parseInt($("#c-max").value, 10) || 128}),
    });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error?.message ?? r.status);
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      // SSE: события разделены пустой строкой, и последнее может быть неполным.
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const event of events) {
        const line = event.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const payload = line.slice(6).trim();
        if (payload === "[DONE]") continue;
        let parsed; try { parsed = JSON.parse(payload); } catch { continue; }
        if (parsed.error) { chatOut += `\n[ошибка: ${parsed.error.message}]`; continue; }
        const piece = parsed.choices?.[0]?.delta?.content ?? "";
        if (piece) {
          if (first === null) first = (Date.now() - started) / 1000;
          tokens += 1;
          chatOut += piece;
          const box = $("#c-out"); if (box) box.textContent = chatOut;
        }
      }
    }
    const seconds = (Date.now() - started) / 1000;
    chatOut += `\n\n[${seconds.toFixed(1)}s всего` +
      (first !== null ? `, первый токен через ${first.toFixed(1)}s` : "") +
      (tokens ? `, ${tokens} кусков, ${(tokens / seconds).toFixed(1)} в секунду]` : "]");
  } catch (e) {
    chatOut += (chatOut ? "\n\n" : "") + "не дошло: " + e.message;
  }
  chatBusy = false; render();
}

// ------------------------------------------------------------------ shell
const VIEWS = {"Nodes": viewNodes, "Models": viewModels, "Work": viewWork,
               "Keys": viewKeys, "Release": viewRelease};

function isEditing() {
  // Re-rendering under the operator's hands wipes a half-typed command.
  const el = document.activeElement;
  return el && el.closest && el.closest("#view") &&
         ["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName);
}

async function render() {
  $("#tabs").innerHTML = Object.keys(VIEWS).map(t =>
    `<button class="${t === active ? "active" : ""}" onclick="pick('${t}')">${t}</button>`).join("");
  try {
    $("#view").innerHTML = await VIEWS[active]();
    $("#err").textContent = "";
  } catch (e) {
    $("#err").textContent = e.message;
  }
  $("#refreshed").textContent = new Date().toLocaleTimeString();
}

function pick(tab) {
  active = tab; localStorage.setItem("loom_tab", tab); message = ""; render();
}

function loop() {
  clearInterval(timer);
  // Пока идёт генерация — не перерисовываем: это лишние запросы и дёрганый
  // текст под руками у того, кто его читает.
  timer = setInterval(() => { if (!isEditing() && !chatBusy) render(); }, 3000);
}

$("#token").value = localStorage.getItem("loom_token") || "";
$("#token").addEventListener("change", () => {
  localStorage.setItem("loom_token", $("#token").value.trim()); render();
});
render(); loop();
</script>
