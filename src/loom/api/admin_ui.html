<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loom Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#d7dce4; --dim:#8b93a1;
          --ok:#4cc38a; --warn:#e5c454; --bad:#e5636e; --acc:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; color:var(--acc); }
  nav button { background:none; border:1px solid transparent; color:var(--dim);
               padding:6px 10px; cursor:pointer; font:inherit; border-radius:6px; }
  nav button.active { color:var(--fg); border-color:var(--line); background:var(--panel); }
  #token { background:var(--panel); border:1px solid var(--line); color:var(--fg);
           padding:5px 8px; border-radius:6px; width:150px; font:inherit; }
  main { padding:16px; max-width:1200px; }
  table { border-collapse:collapse; width:100%; margin:8px 0 20px; }
  th, td { border:1px solid var(--line); padding:5px 9px; text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:normal; background:var(--panel); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .dim { color:var(--dim); } .acc { color:var(--acc); }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  select, textarea, input[type=text] { background:var(--panel); border:1px solid var(--line);
           color:var(--fg); padding:6px 8px; border-radius:6px; font:inherit; }
  textarea { width:100%; min-height:70px; }
  button.action { background:var(--acc); color:#0b0d10; border:none; padding:7px 14px;
                  border-radius:6px; cursor:pointer; font:inherit; font-weight:600; }
  button.danger { background:var(--bad); }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:6px;
        padding:10px; white-space:pre-wrap; word-break:break-word; }
  .muted { color:var(--dim); font-size:12px; }
  #err { color:var(--bad); margin-left:auto; }
</style>
</head>
<body>
<header>
  <h1>loom admin</h1>
  <nav id="tabs"></nav>
  <span class="muted">token:</span>
  <input id="token" type="password" placeholder="admin token">
  <span class="muted" id="refreshed"></span>
  <span id="err"></span>
</header>
<main id="view"></main>
<script>
const TABS = ["Nodes","Models","Keys","Perf-map","SLO / Rebalance","Console"];
let active = localStorage.getItem("loom_tab") || "Nodes";
let perfModel = null;
const $ = s => document.querySelector(s);

const tokenInput = $("#token");
tokenInput.value = localStorage.getItem("loom_admin_token") || "";
tokenInput.onchange = () => { localStorage.setItem("loom_admin_token", tokenInput.value); refresh(); };

function headers(extra) {
  const h = Object.assign({"Content-Type":"application/json"}, extra || {});
  if (tokenInput.value) h["X-Loom-Admin-Token"] = tokenInput.value;
  return h;
}
async function api(path, opts) {
  const r = await fetch(path, Object.assign({headers: headers()}, opts || {}));
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error ? body.error.message : r.status);
  return body;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function statusCls(s) {
  return {serving:"ok", loading:"warn", loaded:"warn", starting:"warn", failed:"bad", stopped:"dim", unknown:"dim"}[s] || "dim";
}
function selectAll(el) {
  if (!el) return;
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

async function copyText(text, btn, fallbackEl) {
  let ok = false;
  // 1. Modern API. Works on https and on localhost; may still throw on a plain
  //    http:// LAN address or when the document is not focused — hence step 2.
  try {
    if (navigator.clipboard) { await navigator.clipboard.writeText(text); ok = true; }
  } catch (e) { ok = false; }
  // 2. Legacy path: a hidden textarea + execCommand (needs a user gesture).
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
  }
  // 3. Last resort: select the text on screen so Ctrl+C / Cmd+C just works.
  if (!ok && fallbackEl) { selectAll(fallbackEl); }
  if (btn) {
    const prev = btn.dataset.label || btn.textContent;
    btn.dataset.label = prev;
    btn.textContent = ok ? "скопировано ✓" : "выделено — Ctrl+C";
    setTimeout(() => { btn.textContent = btn.dataset.label; }, 2000);
  }
  return ok;
}
// Values referenced by copy buttons (avoids quoting problems in inline JS).
const COPY = {};
function copyFrom(id, btn) {
  // Selecting the visible command block is the graceful degradation path.
  return copyText(COPY[id] || "", btn, document.querySelector("#k-cmd"));
}

function table(headersArr, rows) {
  return `<table><tr>${headersArr.map(h=>`<th>${h}</th>`).join("")}</tr>` +
    rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("") + `</table>`;
}

// ------------------------------------------------------------------ tabs
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(t =>
    `<button class="${t===active?"active":""}" onclick="setTab('${t}')">${t}</button>`).join("");
}
function setTab(t) { active = t; localStorage.setItem("loom_tab", t); renderTabs(); refresh(); }

// ------------------------------------------------------------------ views
async function viewNodes() {
  const data = await api("/admin/nodes");
  const rows = Object.entries(data.nodes).map(([nid, n]) => {
    const shards = n.shards.length
      ? n.shards.map(s => `<span class="${statusCls(s.status)}">${esc(s.model_id)}</span>` +
          ` <span class="dim">[${s.layers[0]},${s.layers[1]}) ${s.vram_quota_gb}G ` +
          `req=${s.current_requests}${s.latency_ms?` τ=${s.latency_ms}ms`:""} ${s.status}</span>`).join("<br>")
      : `<span class="dim">—</span>`;
    return [
      esc(nid),
      `${esc(n.device)} <span class="dim">${esc(n.gpu_name||"")} x${n.num_gpus||1}</span>`,
      esc(n.region),
      `${n.vram_declared_gb} GB <span class="dim">of ${n.vram_total_gb} · ${esc(n.detected_by||"")}</span>`,
      n.tflops_fp16,
      n.price === null ? `<span class="dim">n/a (ph.4)</span>` : n.price,
      (n.connected ? `<span class="ok">ctrl</span>` : `<span class="bad">ctrl</span>`) + " / " +
        (n.tunnel ? `<span class="ok">tunnel</span>` : `<span class="bad">tunnel</span>`),
      n.last_heartbeat_s_ago === null ? `<span class="dim">—</span>`
        : (n.last_heartbeat_s_ago < 10 ? `<span class="ok">${n.last_heartbeat_s_ago}s ago</span>`
                                       : `<span class="warn">${n.last_heartbeat_s_ago}s ago</span>`),
      shards,
    ];
  });
  return `<h2>Registered workers</h2>` +
    table(["node","device","region","VRAM decl.","TFLOPs","price","link","heartbeat","shards (status)"], rows);
}

async function viewModels() {
  const data = await api("/admin/models_view");
  const rows = Object.entries(data.models).map(([mid, m]) => {
    const place = m.placement.length
      ? m.placement.map((p, i) => `<span class="dim">stage ${i}</span> ${esc(p.node_id)} ` +
          `<span class="dim">[${p.layers[0]},${p.layers[1]}) ${p.vram_quota_gb}G</span> ` +
          `<span class="${statusCls(p.status)}">${p.status}</span>`).join("<br>")
      : (m.unscheduled ? `<span class="bad">unscheduled — не хватает ёмкости пула</span>` : `<span class="dim">—</span>`);
    // Why a model is not running: the last start error, verbatim from the worker.
    const fails = (m.failures || []).map(f =>
      `<div class="bad">✗ ${esc(f.node_id)}: ${esc(f.error)}` +
      `<span class="dim"> (${f.age_s}s назад, повтор через ${f.retry_in_s}s)</span></div>`).join("");
    const stages = m.placement.length > 1 ? ` <span class="acc">${m.placement.length} стадии</span>` : "";
    return [
      esc(mid) + (m.unscheduled ? ` <span class="bad">●</span>` : "") + stages,
      `${m.priority} / ${m.demand_qps} / ${m.price_willing}<br><span class="dim">score ${m.score}</span>`,
      `${m.k_actual} / ${m.k_target}`,
      `${m.num_layers}L · ${esc(m.backend_type)}`,
      place + fails,
      m.endpoints.map(e => `${esc(e.url)} <span class="dim">inflight=${e.inflight}</span>`).join("<br>") || `<span class="dim">—</span>`,
      `<button class="action danger" onclick="removeModel('${esc(mid)}')">remove</button>`,
    ];
  });
  return `<h2>Развернуть модель (архитектура определяется автоматически)</h2>
    <p><input id="m-repo" type="text" placeholder="HuggingFace repo, напр. Qwen/Qwen3-32B" style="width:320px">
       <select id="m-backend">
         <option value="shard">shard — режется по слоям между узлами (transformers)</option>
         <option value="vllm_shard">vllm_shard — то же, но слои считает vLLM (нужен образ loomworker-vllm)</option>
         <option value="vllm">vllm — быстрее всех, но модель должна влезть на одну карту</option>
       </select>
       prio <input id="m-prio" type="text" value="1" style="width:50px">
       реплик <input id="m-k" type="text" value="1" style="width:50px">
       <button class="action" onclick="deployModel()">deploy</button></p>
    <pre id="m-out" class="muted">${esc(lastDeploy)}</pre>
    <h2>Каталог + раскладка Phase-1</h2>` +
    table(["model","prio/qps/price","k (act/target)","shape","placement (стадии пайплайна)","endpoints",""], rows);
}
let lastDeploy = "— укажите HF-имя модели и нажмите deploy —";
async function deployModel() {
  const repo = $("#m-repo").value.trim();
  if (!repo) { lastDeploy = "укажите repo"; $("#m-out").textContent = lastDeploy; return; }
  lastDeploy = "resolving " + repo + " …";
  $("#m-out").textContent = lastDeploy;
  try {
    const r = await api("/admin/models/from_hf", {method:"POST", body: JSON.stringify({
      repo,
      backend_type: $("#m-backend").value,
      priority: parseFloat($("#m-prio").value) || 1,
      target_pipelines: parseInt($("#m-k").value, 10) || 1,
    })});
    const d = r.detected, s = r.sizing;
    lastDeploy =
      `added: ${r.added}\n` +
      `detected: ${d.num_layers} слоёв, hidden ${d.hidden_dim}, kv_heads ${d.num_kv_heads}, ` +
      `${d.dtype_bytes} байт/параметр${d.architectures ? " (" + d.architectures.join(",") + ")" : ""}\n` +
      `веса ~${s.weights_gb} GB · слоёв на карту: ` +
      Object.entries(s.layers_per_card).map(([k,v]) => `${k}=${v}`).join(", ") +
      ` (param_mem_ratio ${s.param_mem_ratio})`;
    refresh();
  } catch (e) { lastDeploy = "error: " + e.message; $("#m-out").textContent = lastDeploy; }
}
async function removeModel(id) {
  try { await api("/admin/models/" + encodeURIComponent(id), {method:"DELETE"}); refresh(); }
  catch (e) { $("#err").textContent = e.message; }
}

async function viewKeys() {
  const conn = await api("/admin/connect");
  const data = await api("/admin/keys");
  COPY.cmd = localStorage.getItem("loom_last_key_only_cmd") || "";
  COPY.key = lastKeyRaw;
  COPY.addr = conn.dial_address || "";
  const rows = (data.keys || []).map(k => [
    esc(k.key_id),
    esc(k.label || "—"),
    esc(k.address),
    k.max_nodes ? k.max_nodes : `<span class="dim">∞</span>`,
    k.nodes.length ? k.nodes.map(esc).join("<br>") : `<span class="dim">unused</span>`,
    k.revoked ? `<span class="bad">revoked</span>` : `<span class="ok">active</span>`,
    k.revoked ? "" : `<button class="action danger" onclick="revokeKey('${esc(k.key_id)}')">revoke</button>`,
  ]);
  const sev = conn.severity || (conn.warning ? "warn" : "ok");
  const cls = {ok:"ok", info:"warn", warn:"bad"}[sev] || "dim";
  const icon = {ok:"✓", info:"ℹ", warn:"⚠"}[sev] || "";
  const status = conn.note
    ? `<p class="${cls}">${icon} ${esc(conn.note)}</p>`
    : `<p class="ok">✓ адрес доступен воркерам</p>`;
  const check = {true:"TCP-проверка прошла", false:"TCP-проверка не прошла",
                 null:"TCP-проверка не выполнялась"}[String(conn.self_check)];
  return `<h2>Адрес подключения воркеров</h2>
    <p>воркеры звонят на <b>${esc(conn.dial_address)}</b>
       <button class="action" onclick="copyFrom('addr', this)">copy</button>
       <span class="dim">(источник: ${esc(conn.source)}${conn.source === "env" ? " — задан вами в .env" : " — определён автоматически"}; ${esc(check || "")})</span></p>
    ${status}
    <h2>Join keys — всё, что нужно владельцу GPU</h2>
    <p><input id="k-label" type="text" placeholder="label, e.g. gpu-box-1">
       <input id="k-max" type="text" placeholder="max nodes (blank = ∞)" style="width:170px">
       <button class="action" onclick="issueKey()">issue key</button>
       ${lastKeyRaw ? `<button class="action" onclick="copyFrom('cmd', this)">copy команду</button>
         <button class="action" onclick="copyFrom('key', this)">copy только ключ</button>` : ""}</p>
    ${lastKeyRaw
      ? `<p class="muted">На GPU-машине выполнить ОДНУ команду (клик по строке выделяет её):</p>
         <pre id="k-cmd" onclick="selectAll(this)">${esc(COPY.cmd)}</pre>
         <p class="muted">адрес оркестратора ${esc(conn.dial_address)} уже внутри ключа</p>`
      : `<pre id="k-out" class="muted">${esc(lastKey)}</pre>`}` +
    table(["key id","label","dial address","max nodes","used by","state",""], rows);
}
let lastKey = localStorage.getItem("loom_last_key_cmd") ||
  "— issue a key, then run the printed command on the GPU machine —";
let lastKeyRaw = localStorage.getItem("loom_last_key_raw") || "";
let connCache = null;
async function issueKey() {
  const label = $("#k-label").value;
  const maxNodes = parseInt($("#k-max").value, 10);
  try {
    const r = await api("/admin/keys", {method:"POST", body: JSON.stringify(
      {label, max_nodes: Number.isFinite(maxNodes) ? maxNodes : 0})});
    const cmd = "docker run -d --gpus all --restart unless-stopped " +
      (r.worker_image || "gihpee/loomworker") + " --key " + r.key;
    lastKeyRaw = r.key;
    lastKey = "На GPU-машине выполнить ОДНУ команду:\n\n" + cmd +
      "\n\n(адрес оркестратора " + r.address + " уже внутри ключа)";
    localStorage.setItem("loom_last_key_cmd", lastKey);
    localStorage.setItem("loom_last_key_raw", r.key);
    localStorage.setItem("loom_last_key_only_cmd", cmd);
    refresh();
  } catch (e) { lastKey = "error: " + e.message; $("#k-out").textContent = lastKey; }
}
async function revokeKey(id) {
  try { await api("/admin/keys/" + id, {method:"DELETE"}); refresh(); }
  catch (e) { $("#err").textContent = e.message; }
}

async function viewPerfmap() {
  const models = await api("/admin/models_view");
  const ids = Object.keys(models.models);
  if (!ids.length) return `<p class="dim">no models</p>`;
  if (!perfModel || !ids.includes(perfModel)) perfModel = ids[0];
  const pm = await api("/admin/perfmap/" + encodeURIComponent(perfModel));
  const sel = `<select onchange="perfModel=this.value;refresh()">` +
    ids.map(i=>`<option ${i===perfModel?"selected":""}>${esc(i)}</option>`).join("") + `</select>`;

  const tauRows = Object.entries(pm.tau_effective).map(([nid, t]) => {
    const meas = pm.tau_measured[nid];
    return [
      esc(nid),
      t.layers[0]===null ? `<span class="dim">—</span>` : `[${t.layers[0]}, ${t.layers[1]})`,
      t.layer_latency_ms === null ? `<span class="bad">inf</span>` : `${t.layer_latency_ms} ms`,
      `<span class="${t.source==="measured"?"ok":"warn"}">${t.source}</span>`,
      meas ? `${meas.latency_ms ?? "—"} ms <span class="dim">(age ${meas.age_s}s, req=${meas.current_requests}, ${meas.healthy?"healthy":"unhealthy"})</span>` : `<span class="dim">no report</span>`,
    ];
  });
  const nodes = Object.keys(pm.tau_effective);
  const rhoRows = nodes.map(src => [esc(src), ...nodes.map(dst => {
    if (src===dst) return `<span class="dim">0</span>`;
    const v = pm.tau_effective[src].rtt_to[dst];
    return v === undefined ? `<span class="dim">∞</span>` : `${v}`;
  })]);
  const route = pm.route_preview
    ? `chain: <b>${pm.route_preview.path.map(esc).join(" → ") || "∅"}</b>` +
      (pm.route_preview.est_latency_ms !== null ? ` <span class="dim">est ${pm.route_preview.est_latency_ms} ms</span>` : ` <span class="bad">no finite route</span>`)
    : `<span class="dim">no scheduler instance</span>`;
  return `<h2>Perf-map · model ${sel}</h2>
    <p>Phase-2 route preview → ${route}</p>
    <h2>τ — per-shard latency</h2>` +
    table(["node","layers","effective τ (DP input)","source","measured (perf-map store)"], tauRows) +
    `<h2>ρ — RTT matrix (ms)</h2>` +
    (nodes.length ? table(["src \\ dst", ...nodes.map(esc)], rhoRows) : `<p class="dim">no nodes</p>`);
}

async function viewSlo() {
  const st = await api("/admin/status");
  const rows = Object.entries(st.models).map(([mid, m]) => {
    const s = m.slo;
    return [
      esc(mid),
      s && s.slo_p95_ttft_ms ? `${s.slo_p95_ttft_ms} ms` : `<span class="dim">no SLO</span>`,
      s ? `${s.p95_ttft_ms} ms <span class="dim">(${s.samples} samples)</span>` : `<span class="dim">no traffic</span>`,
      s ? `${(s.error_rate*100).toFixed(1)}%` : `<span class="dim">—</span>`,
      s && s.boost > 1 ? `<span class="bad">BOOSTED ×${s.boost}</span>` : `<span class="ok">off</span>`,
      m.endpoints.length ? `<span class="ok">serving</span>` : `<span class="bad">no capacity</span>`,
    ];
  });
  return `<h2>SLO per model</h2>` +
    table(["model","SLO p95 TTFT","current p95","error rate","boost","state"], rows) +
    `<p><button class="action danger" onclick="forceRebalance()">force rebalance</button>
     <span class="muted">runs the Resource Broker pass right now (same as the timer trigger)</span></p>
     <pre id="rebalance-out" class="muted">${esc(lastRebalance)}</pre>
     <p class="dim">unscheduled: ${st.unscheduled.length ? st.unscheduled.map(esc).join(", ") : "none"}</p>`;
}
let lastRebalance = "—";
async function forceRebalance() {
  lastRebalance = "running…";
  $("#rebalance-out").textContent = lastRebalance;
  try {
    const r = await api("/admin/rebalance", {method:"POST"});
    lastRebalance = new Date().toLocaleTimeString() + "\n" + JSON.stringify(r, null, 2);
    refresh();
  } catch (e) { lastRebalance = "error: " + e.message; $("#rebalance-out").textContent = lastRebalance; }
}

async function viewConsole() {
  const models = await api("/v1/models");
  const opts = models.data.map(m=>`<option>${esc(m.id)}</option>`).join("");
  return `<h2>Test console → POST /v1/chat/completions</h2>
    <p>model <select id="c-model">${opts}</select>
       max_tokens <input id="c-maxtok" type="text" value="1024" style="width:70px">
       <label class="muted"><input type="checkbox" id="c-stream"> stream</label>
       <label class="muted" title="Qwen3 и другие reasoning-модели: выключает блок &lt;think&gt;">
         <input type="checkbox" id="c-nothink"> без think</label></p>
    <textarea id="c-prompt" placeholder="prompt…">привет, loom</textarea>
    <p><button class="action" onclick="sendChat()">send</button></p>
    <pre id="c-out" class="muted">—</pre>
    <div id="c-stats"></div>
    <div id="c-hist">${renderHistory()}</div>`;
}
async function sendChat() {
  const out = $("#c-out");
  out.textContent = "…";
  $("#c-stats").innerHTML = "";
  const body = {model: $("#c-model").value, stream: $("#c-stream").checked,
                messages: [{role:"user", content: $("#c-prompt").value}]};
  const maxTok = parseInt($("#c-maxtok").value, 10);
  if (maxTok > 0) body.max_tokens = maxTok;
  // Reasoning models burn hundreds of tokens inside <think> before answering.
  const noThink = $("#c-nothink").checked;
  if (noThink) body.chat_template_kwargs = {enable_thinking: false};

  // Client-side clock. The server reports its own numbers; the difference
  // between the two is what the API hop plus the worker tunnel cost.
  const t0 = performance.now();
  let firstChunkAt = null, chunkTimes = [], text = "", reason = null;
  let usage = null, timings = null;
  try {
    const r = await fetch("/v1/chat/completions", {method:"POST", headers: headers(), body: JSON.stringify(body)});
    if (body.stream) {
      if (!r.ok) { out.textContent = JSON.stringify(await r.json().catch(() => ({})), null, 2); return; }
      // Render the stream as text, the way a chat looks — not as raw SSE frames.
      out.textContent = "";
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        // SSE events are separated by a blank line; a chunk can split one in
        // half, so keep the unterminated tail for the next read.
        const events = buf.split("\n\n");
        buf = events.pop();
        for (const ev of events) {
          for (const line of ev.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;
            try {
              const frame = JSON.parse(payload);
              const choice = (frame.choices || [])[0] || {};
              if (choice.delta && choice.delta.content) {
                const now = performance.now();
                if (firstChunkAt === null) firstChunkAt = now;
                chunkTimes.push(now);
                text += choice.delta.content;
              }
              if (choice.finish_reason) reason = choice.finish_reason;
              if (frame.usage) usage = frame.usage;        // closing chunk
              if (frame.timings) timings = frame.timings;  // closing chunk
            } catch (e) { /* a frame we cannot parse is not worth breaking the view */ }
          }
        }
        out.textContent = text;  // grows live, like a chat
      }
      if (reason) out.textContent = text + reasonNote(reason);
    } else {
      const j = await r.json();
      if (r.ok && j.choices) {
        reason = j.choices[0].finish_reason;
        text = j.choices[0].message.content;
        usage = j.usage || null;
        timings = j.timings || null;
        out.textContent = text + reasonNote(reason);
      } else {
        out.textContent = JSON.stringify(j, null, 2);
        return;
      }
    }
  } catch (e) { out.textContent = "error: " + e.message; return; }

  const totalMs = performance.now() - t0;
  const run = buildRun({body, noThink, totalMs, firstChunkAt, t0, chunkTimes, usage, timings, reason, text});
  $("#c-stats").innerHTML = renderRunStats(run);
  pushRun(run);
  $("#c-hist").innerHTML = renderHistory();
}

function reasonNote(reason) {
  // "length" means the cap cut the answer off, not that the model stopped.
  return reason === "length"
    ? `\n\n⚠ finish_reason=length — ответ обрезан лимитом max_tokens, поднимите его`
    : `\n\nfinish_reason=${reason}`;
}

// ---------------------------------------------------------------- run stats
function pct(sorted, q) {
  if (!sorted.length) return 0;
  return sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))];
}

function buildRun({body, noThink, totalMs, firstChunkAt, t0, chunkTimes, usage, timings, reason, text}) {
  // Gaps between streamed tokens as the client saw them (empty for non-stream).
  const gaps = [];
  for (let i = 1; i < chunkTimes.length; i++) gaps.push(chunkTimes[i] - chunkTimes[i-1]);
  const sortedGaps = gaps.slice().sort((a,b) => a-b);
  const clientTtft = firstChunkAt === null ? null : firstChunkAt - t0;
  // Prefer the server's token count; fall back to counting stream chunks.
  const completion = usage ? usage.completion_tokens : chunkTimes.length;
  const decodeMs = clientTtft === null ? null : totalMs - clientTtft;
  return {
    at: Date.now(),
    model: body.model,
    stream: !!body.stream,
    noThink,
    maxTokens: body.max_tokens || null,
    reason,
    chars: text.length,
    promptTokens: usage ? usage.prompt_tokens : null,
    completionTokens: completion,
    totalMs,
    clientTtftMs: clientTtft,
    // Steady-state speed: prefill excluded, which is the number worth comparing.
    // Needs a real decode window: a backend that flushes every chunk at once
    // (the echo stub, a proxy that buffers) would otherwise report thousands
    // of tokens/s, which is a measurement artefact, not a speed.
    clientDecodeTps: (decodeMs && decodeMs >= 5 && completion > 1)
      ? ((completion - 1) / (decodeMs / 1000)) : null,
    clientTps: totalMs > 0 && completion ? completion / (totalMs / 1000) : null,
    gapP50: pct(sortedGaps, 0.5),
    gapP95: pct(sortedGaps, 0.95),
    gaps,
    server: timings || null,
  };
}

function ms(v) { return v === null || v === undefined ? "—" : (v >= 1000 ? (v/1000).toFixed(2) + " s" : v.toFixed(0) + " ms"); }
function num(v, d) { return v === null || v === undefined ? "—" : v.toFixed(d === undefined ? 1 : d); }

function card(label, value, hint) {
  return `<div style="border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:120px">
    <div class="muted">${label}</div>
    <div style="font-size:17px;color:var(--acc)">${value}</div>
    ${hint ? `<div class="muted">${hint}</div>` : ""}</div>`;
}

function renderRunStats(run) {
  const s = run.server;
  const tps = run.clientDecodeTps !== null ? run.clientDecodeTps : (s ? s.decode_tokens_per_s : null);
  const ttft = run.clientTtftMs !== null ? run.clientTtftMs : (s ? s.ttft_ms : null);
  const cards = [
    card("tokens/s (decode)", num(tps, 2), "без учёта prefill"),
    card("TTFT", ms(ttft), "до первого токена"),
    card("время ответа", ms(run.totalMs), run.stream ? "клиент, весь стрим" : "клиент, весь запрос"),
    card("токенов", `${run.completionTokens ?? "—"}`,
         run.promptTokens !== null ? `prompt ${run.promptTokens}` : "по чанкам стрима"),
    card("tokens/s (e2e)", num(run.clientTps, 2), "включая prefill"),
    // Server numbers first: several tokens can share one network chunk, so the
    // client's own gaps understate the cadence and overstate its spread.
    card("между токенами",
         s ? `${num(s.inter_token_ms_p50)} / ${num(s.inter_token_ms_p95)} ms`
           : (run.gaps.length ? `${num(run.gapP50)} / ${num(run.gapP95)} ms` : "—"),
         s ? "p50 / p95 · голова" : "p50 / p95 · клиент"),
  ];
  let serverBlock = "";
  if (s) {
    // The gap between the two clocks is the API hop + the worker tunnel.
    const overhead = run.totalMs - s.total_ms;
    const perHop = s.stages > 1 ? s.inter_token_ms_p50 / s.stages : null;
    // Measured split, not arithmetic: every stage reports its own duration and
    // the head subtracts them from the round trip it timed itself.
    const split = s.transport_ms_p50 !== undefined ? `
      <p style="margin-top:6px">на что уходит токен (p50 / p95):
        <span class="dim">свои слои</span> ${num(s.head_compute_ms_p50)} / ${num(s.head_compute_ms_p95)} ms ·
        <span class="dim">остальные стадии</span> ${num(s.peer_compute_ms_p50)} / ${num(s.peer_compute_ms_p95)} ms ·
        <span class="${s.transport_share > 0.4 ? "bad" : "acc"}">транспорт</span>
        ${num(s.transport_ms_p50)} / ${num(s.transport_ms_p95)} ms
        <b>(${Math.round(100 * s.transport_share)}% времени)</b></p>` : "";
    serverBlock = `<p class="muted" style="margin-top:10px">по данным головы пайплайна:
      prefill ${ms(s.ttft_ms)} (${num(s.prompt_tokens_per_s)} tok/s) ·
      decode ${ms(s.decode_ms)} (${num(s.decode_tokens_per_s, 2)} tok/s) ·
      между токенами p50 ${num(s.inter_token_ms_p50)} / p95 ${num(s.inter_token_ms_p95)} / max ${num(s.inter_token_ms_max)} ms ·
      стадий ${s.stages}${perHop ? ` (≈ ${num(perHop)} ms на переход)` : ""} ·
      накладные транспорта ${ms(Math.max(0, overhead))}</p>${split}`;
  } else {
    serverBlock = `<p class="muted" style="margin-top:10px">бэкенд не прислал timings —
      цифры измерены клиентом (vLLM-бэкенд или старый образ воркера)</p>`;
  }
  const spark = run.gaps.length > 1
    ? `<h2 style="margin-top:16px">Приход токенов клиенту (ms между чанками)</h2>${sparkline(run.gaps)}`
    : "";
  return `<h2 style="margin-top:16px">Статистика запроса</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${cards.join("")}</div>
    ${serverBlock}${spark}`;
}

// ------------------------------------------------------------------ charts
function sparkline(values) {
  const w = 620, h = 70, pad = 4;
  const max = Math.max(...values), min = Math.min(...values);
  const span = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i / Math.max(1, values.length - 1)) * (w - 2*pad);
    const y = h - pad - ((v - min) / span) * (h - 2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:${h}px;
      background:var(--panel);border:1px solid var(--line);border-radius:6px">
      <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.5"/>
    </svg>
    <p class="muted">мин ${num(min)} · медиана ${num(pct(values.slice().sort((a,b)=>a-b), 0.5))} ·
       макс ${num(max)} ms · ${values.length} интервалов</p>`;
}

function barChart(rows, unit, colorVar) {
  // Horizontal bars: labels stay readable however long the model id is.
  // A run with nothing measurable (non-streamed, old worker image) gets an
  // empty bar and a dash — not a zero, which would read as "it was that slow".
  const values = rows.map(r => r.value).filter(v => v !== null && v !== undefined);
  const max = Math.max(...values, 0.0001);
  return `<div style="display:flex;flex-direction:column;gap:3px;margin:6px 0 14px">` +
    rows.map(r => {
      const has = r.value !== null && r.value !== undefined;
      const width = has ? (100 * r.value / max).toFixed(1) : 0;
      return `<div style="display:flex;align-items:center;gap:8px">
      <span class="muted" style="width:160px;text-align:right;flex:none">${esc(r.label)}</span>
      <span style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:4px;height:16px">
        <span style="display:block;height:100%;width:${width}%;
              background:var(${colorVar});border-radius:3px"></span></span>
      <span style="width:110px;flex:none">${has ? num(r.value, 2) + " " + unit : "<span class=\'dim\'>—</span>"}</span>
    </div>`;
    }).join("") + `</div>`;
}

// ---------------------------------------------------------------- history
const HIST_KEY = "loom_console_runs";
function loadRuns() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch (e) { return []; }
}
function pushRun(run) {
  // Keep the raw gap series out of storage: it is per-run detail, and 20 runs
  // of it would blow past the localStorage quota.
  const {gaps, ...slim} = run;
  const runs = loadRuns();
  runs.unshift(slim);
  localStorage.setItem(HIST_KEY, JSON.stringify(runs.slice(0, 20)));
}
function clearRuns() { localStorage.removeItem(HIST_KEY); $("#c-hist").innerHTML = renderHistory(); }

function runLabel(r) {
  const when = new Date(r.at).toLocaleTimeString();
  return `${when} ${r.model}${r.noThink ? " ·no-think" : ""}${r.stream ? " ·stream" : ""}`;
}

function renderHistory() {
  const runs = loadRuns();
  if (!runs.length) {
    return `<h2 style="margin-top:20px">История прогонов</h2>
            <p class="muted">пусто — отправьте запрос, и здесь появится сравнение</p>`;
  }
  const pick = (client, serverKey) => runs.map(r => {
    const own = r[client];
    if (own !== null && own !== undefined) return {label: runLabel(r), value: own};
    return {label: runLabel(r), value: r.server ? r.server[serverKey] : null};
  });
  const tps = pick("clientDecodeTps", "decode_tokens_per_s");
  const ttft = pick("clientTtftMs", "ttft_ms");
  const rows = runs.map(r => [
    new Date(r.at).toLocaleTimeString(),
    esc(r.model) + (r.noThink ? ` <span class="dim">no-think</span>` : "") +
      (r.stream ? ` <span class="dim">stream</span>` : ""),
    `${r.completionTokens ?? "—"}${r.promptTokens !== null && r.promptTokens !== undefined ? ` <span class="dim">+${r.promptTokens} prompt</span>` : ""}`,
    num(r.clientDecodeTps, 2),
    ms(r.clientTtftMs),
    ms(r.totalMs),
    r.server ? `${num(r.server.inter_token_ms_p50)} / ${num(r.server.inter_token_ms_p95)}` : "—",
    r.server ? r.server.stages : "—",
    r.reason === "length" ? `<span class="warn">length</span>` : `<span class="dim">${esc(r.reason || "—")}</span>`,
  ]);
  return `<h2 style="margin-top:20px">Сравнение прогонов
      <button class="action danger" style="margin-left:8px;padding:2px 8px" onclick="clearRuns()">очистить</button></h2>
    <p class="muted">tokens/s (decode) — больше лучше</p>${barChart(tps, "tok/s", "--ok")}
    <p class="muted">TTFT — меньше лучше</p>${barChart(ttft, "ms", "--warn")}
    ` + table(["время","модель","токенов","tok/s","TTFT","всего","между токенами p50/p95","стадий","finish"], rows);
}

// ------------------------------------------------------------------ refresh
const VIEWS = {"Nodes":viewNodes, "Models":viewModels, "Keys":viewKeys,
               "Perf-map":viewPerfmap, "SLO / Rebalance":viewSlo, "Console":viewConsole};
let timer = null;
async function refresh() {
  clearTimeout(timer);
  try {
    $("#err").textContent = "";
    $("#view").innerHTML = await VIEWS[active]();
    $("#refreshed").textContent = "· " + new Date().toLocaleTimeString();
  } catch (e) { $("#err").textContent = e.message; }
  if (active !== "Console") timer = setTimeout(refresh, 3000);
}
renderTabs();
refresh();
</script>
</body>
</html>
