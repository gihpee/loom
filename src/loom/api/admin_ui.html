<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loom Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#d7dce4; --dim:#8b93a1;
          --ok:#4cc38a; --warn:#e5c454; --bad:#e5636e; --acc:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; color:var(--acc); }
  nav button { background:none; border:1px solid transparent; color:var(--dim);
               padding:6px 10px; cursor:pointer; font:inherit; border-radius:6px; }
  nav button.active { color:var(--fg); border-color:var(--line); background:var(--panel); }
  #token { background:var(--panel); border:1px solid var(--line); color:var(--fg);
           padding:5px 8px; border-radius:6px; width:150px; font:inherit; }
  main { padding:16px; max-width:1200px; }
  table { border-collapse:collapse; width:100%; margin:8px 0 20px; }
  th, td { border:1px solid var(--line); padding:5px 9px; text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:normal; background:var(--panel); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .dim { color:var(--dim); } .acc { color:var(--acc); }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  select, textarea, input[type=text] { background:var(--panel); border:1px solid var(--line);
           color:var(--fg); padding:6px 8px; border-radius:6px; font:inherit; }
  textarea { width:100%; min-height:70px; }
  button.action { background:var(--acc); color:#0b0d10; border:none; padding:7px 14px;
                  border-radius:6px; cursor:pointer; font:inherit; font-weight:600; }
  button.danger { background:var(--bad); }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:6px;
        padding:10px; white-space:pre-wrap; word-break:break-word; }
  .muted { color:var(--dim); font-size:12px; }
  #err { color:var(--bad); margin-left:auto; }
</style>
</head>
<body>
<header>
  <h1>loom admin</h1>
  <nav id="tabs"></nav>
  <span class="muted">token:</span>
  <input id="token" type="password" placeholder="admin token">
  <span class="muted" id="refreshed"></span>
  <span id="err"></span>
</header>
<main id="view"></main>
<script>
const TABS = ["Nodes","Models","Deploy","Keys","Perf-map","SLO / Rebalance","Console"];
let active = localStorage.getItem("loom_tab") || "Nodes";
let perfModel = null;
const $ = s => document.querySelector(s);

const tokenInput = $("#token");
tokenInput.value = localStorage.getItem("loom_admin_token") || "";
tokenInput.onchange = () => { localStorage.setItem("loom_admin_token", tokenInput.value); refresh(); };

function headers(extra) {
  const h = Object.assign({"Content-Type":"application/json"}, extra || {});
  if (tokenInput.value) h["X-Loom-Admin-Token"] = tokenInput.value;
  return h;
}
async function api(path, opts) {
  const r = await fetch(path, Object.assign({headers: headers()}, opts || {}));
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error ? body.error.message : r.status);
  return body;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function statusCls(s) {
  return {serving:"ok", loading:"warn", loaded:"warn", starting:"warn", failed:"bad", stopped:"dim", unknown:"dim"}[s] || "dim";
}
function selectAll(el) {
  if (!el) return;
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

async function copyText(text, btn, fallbackEl) {
  let ok = false;
  // 1. Modern API. Works on https and on localhost; may still throw on a plain
  //    http:// LAN address or when the document is not focused — hence step 2.
  try {
    if (navigator.clipboard) { await navigator.clipboard.writeText(text); ok = true; }
  } catch (e) { ok = false; }
  // 2. Legacy path: a hidden textarea + execCommand (needs a user gesture).
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
  }
  // 3. Last resort: select the text on screen so Ctrl+C / Cmd+C just works.
  if (!ok && fallbackEl) { selectAll(fallbackEl); }
  if (btn) {
    const prev = btn.dataset.label || btn.textContent;
    btn.dataset.label = prev;
    btn.textContent = ok ? "скопировано ✓" : "выделено — Ctrl+C";
    setTimeout(() => { btn.textContent = btn.dataset.label; }, 2000);
  }
  return ok;
}
// Values referenced by copy buttons (avoids quoting problems in inline JS).
const COPY = {};
function copyFrom(id, btn) {
  // Selecting the visible command block is the graceful degradation path.
  return copyText(COPY[id] || "", btn, document.querySelector("#k-cmd"));
}

function table(headersArr, rows) {
  return `<table><tr>${headersArr.map(h=>`<th>${h}</th>`).join("")}</tr>` +
    rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("") + `</table>`;
}

// ------------------------------------------------------------------ tabs
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(t =>
    `<button class="${t===active?"active":""}" onclick="setTab('${t}')">${t}</button>`).join("");
}
function setTab(t) {
  active = t;
  localStorage.setItem("loom_tab", t);
  renderTabs();
  refresh({reset: true});
}

// ------------------------------------------------------------------ views
async function viewNodes() {
  const data = await api("/admin/nodes");
  const rows = Object.entries(data.nodes).map(([nid, n]) => {
    const shards = n.shards.length
      ? n.shards.map(s => `<span class="${statusCls(s.status)}">${esc(s.model_id)}</span>` +
          ` <span class="dim">[${s.layers[0]},${s.layers[1]}) ${s.vram_quota_gb}G ` +
          `req=${s.current_requests}${s.latency_ms?` τ=${s.latency_ms}ms`:""} ${s.status}</span>`).join("<br>")
      : `<span class="dim">—</span>`;
    return [
      esc(nid),
      `${esc(n.device)} <span class="dim">${esc(n.gpu_name||"")} x${n.num_gpus||1}</span>`,
      esc(n.region),
      `${n.vram_declared_gb} GB <span class="dim">of ${n.vram_total_gb} · ${esc(n.detected_by||"")}</span>`,
      n.tflops_fp16,
      n.price === null ? `<span class="dim">n/a (ph.4)</span>` : n.price,
      (n.connected ? `<span class="ok">ctrl</span>` : `<span class="bad">ctrl</span>`) + " / " +
        (n.tunnel ? `<span class="ok">tunnel</span>` : `<span class="bad">tunnel</span>`),
      n.last_heartbeat_s_ago === null ? `<span class="dim">—</span>`
        : (n.last_heartbeat_s_ago < 10 ? `<span class="ok">${n.last_heartbeat_s_ago}s ago</span>`
                                       : `<span class="warn">${n.last_heartbeat_s_ago}s ago</span>`),
      shards,
    ];
  });
  return `<h2>Registered workers</h2>` +
    table(["node","device","region","VRAM decl.","TFLOPs","price","link","heartbeat","shards (status)"], rows);
}

async function viewModels() {
  const data = await api("/admin/models_view");
  const rows = Object.entries(data.models).map(([mid, m]) => {
    const place = m.placement.length
      ? m.placement.map((p, i) => `<span class="dim">stage ${i}</span> ${esc(p.node_id)} ` +
          `<span class="dim">[${p.layers[0]},${p.layers[1]}) ${p.vram_quota_gb}G</span> ` +
          `<span class="${statusCls(p.status)}">${p.status}</span>`).join("<br>")
      : (m.unscheduled ? `<span class="bad">unscheduled — не хватает ёмкости пула</span>` : `<span class="dim">—</span>`);
    // Why a model is not running: the last start error, verbatim from the worker.
    const fails = (m.failures || []).map(f =>
      `<div class="bad">✗ ${esc(f.node_id)}: ${esc(f.error)}` +
      `<span class="dim"> (${f.age_s}s назад, повтор через ${f.retry_in_s}s)</span></div>`).join("");
    const stages = m.placement.length > 1 ? ` <span class="acc">${m.placement.length} стадии</span>` : "";
    return [
      esc(mid) + (m.unscheduled ? ` <span class="bad">●</span>` : "") + stages,
      `${m.priority} / ${m.demand_qps} / ${m.price_willing}<br><span class="dim">score ${m.score}</span>`,
      `${m.k_actual} / ${m.k_target}`,
      `${m.num_layers}L · ${esc(m.backend_type)}`,
      place + fails,
      m.endpoints.map(e => `${esc(e.url)} <span class="dim">inflight=${e.inflight}</span>`).join("<br>") || `<span class="dim">—</span>`,
      `<button class="action danger" onclick="removeModel('${esc(mid)}')">remove</button>`,
    ];
  });
  return `<h2>Добавить модель в каталог (архитектура определяется автоматически)</h2>
    <p class="dim">Добавление НЕ запускает модель на нодах — это делается на вкладке
       <b>Deploy</b>, где выбираются ноды и число слоёв на каждую.</p>
    <p><input id="m-repo" type="text" placeholder="HuggingFace repo, напр. Qwen/Qwen3-32B" style="width:320px">
       <select id="m-backend">
         <option value="shard">shard — режется по слоям между узлами (transformers)</option>
         <option value="vllm_shard">vllm_shard — то же, но слои считает vLLM (нужен образ loomworker-vllm)</option>
         <option value="vllm">vllm — быстрее всех, но модель должна влезть на одну карту</option>
       </select>
       prio <input id="m-prio" type="text" value="1" style="width:50px">
       реплик <input id="m-k" type="text" value="1" style="width:50px">
       <button class="action" onclick="deployModel()">в каталог</button></p>
    <pre id="m-out" class="muted">${esc(lastDeploy)}</pre>
    <h2>Каталог</h2>` +
    table(["model","prio/qps/price","k (act/target)","shape","placement (стадии пайплайна)","endpoints",""], rows);
}
let lastDeploy = "— укажите HF-имя модели, затем разверните её на вкладке Deploy —";
async function deployModel() {
  const repo = $("#m-repo").value.trim();
  if (!repo) { lastDeploy = "укажите repo"; $("#m-out").textContent = lastDeploy; return; }
  lastDeploy = "resolving " + repo + " …";
  $("#m-out").textContent = lastDeploy;
  try {
    const r = await api("/admin/models/from_hf", {method:"POST", body: JSON.stringify({
      repo,
      backend_type: $("#m-backend").value,
      priority: parseFloat($("#m-prio").value) || 1,
      target_pipelines: parseInt($("#m-k").value, 10) || 1,
    })});
    const d = r.detected, s = r.sizing;
    lastDeploy =
      `added: ${r.added}\n` +
      `detected: ${d.num_layers} слоёв, hidden ${d.hidden_dim}, kv_heads ${d.num_kv_heads}, ` +
      `${d.dtype_bytes} байт/параметр${d.architectures ? " (" + d.architectures.join(",") + ")" : ""}\n` +
      `веса ~${s.weights_gb} GB · слоёв на карту: ` +
      Object.entries(s.layers_per_card).map(([k,v]) => `${k}=${v}`).join(", ") +
      ` (param_mem_ratio ${s.param_mem_ratio})`;
    refresh({reset: true});  // model added — start the form empty for the next one
  } catch (e) { lastDeploy = "error: " + e.message; $("#m-out").textContent = lastDeploy; }
}
async function removeModel(id) {
  try { await api("/admin/models/" + encodeURIComponent(id), {method:"DELETE"}); refresh(); }
  catch (e) { $("#err").textContent = e.message; }
}

// ------------------------------------------------------------------ deploy
// Hand placement: which nodes run a model and how many layers each gets.
// The broker normally decides this, which is right for a marketplace and
// useless for a measurement — comparing one node against two against three
// needs the split pinned by hand and identical between runs.
function depKey(nodeId) { return String(nodeId).replace(/[^A-Za-z0-9_-]/g, "_"); }
let depNodeIds = [];
let depSplittable = {};
let depMsg = "";

async function viewDeploy() {
  const data = await api("/admin/placement");
  depNodeIds = data.nodes.map(n => n.node_id);
  if (!data.models.length) {
    return `<h2>Deploy</h2><p class="dim">каталог пуст — добавьте модель на вкладке Models</p>`;
  }
  if (!data.nodes.length) {
    return `<h2>Deploy</h2><p class="dim">нет подключённых нод</p>`;
  }
  const sel = document.querySelector("#dep-model");
  const chosenId = (sel && sel.value) || data.models[0].model_id;
  const chosen = data.models.find(m => m.model_id === chosenId) || data.models[0];

  const options = data.models.map(m =>
    `<option value="${esc(m.model_id)}" ${m.model_id===chosen.model_id?"selected":""}>` +
    `${esc(m.model_id)} — ${m.num_layers} слоёв, ~${m.weights_gb} GB</option>`).join("");

  // Backend is a property of the RUN, not of the catalog entry: the same
  // checkpoint is served whole by `vllm` and split by `shard`. Backends that
  // cannot be a pipeline stage are labelled, because picking one and ticking
  // two nodes is exactly how three nodes end up downloading a checkpoint each
  // only to refuse the load.
  const backends = data.backends.map(b =>
    `<option value="${esc(b.name)}" ${b.name===chosen.backend_type?"selected":""}>` +
    `${esc(b.name)}${b.splits ? "" : " — только целиком, на одну ноду"}</option>`).join("");
  depSplittable = {};
  data.backends.forEach(b => { depSplittable[b.name] = b.splits; });

  const rows = data.nodes.map((n, i) => {
    const k = depKey(n.node_id);
    const ceiling = chosen.max_layers_per_node[n.node_id] || 0;
    const busy = n.busy_with.length ? `<span class="warn">занята: ${n.busy_with.map(esc).join(", ")}</span>` : `<span class="dim">свободна</span>`;
    return [
      `<input type="checkbox" id="dep-on-${k}" onchange="depTotal()">`,
      `<input type="text" id="dep-ord-${k}" value="${i+1}" style="width:36px" onchange="depTotal()">`,
      esc(n.node_id),
      `${esc(n.gpu_name || n.device)} · ${n.vram_free_gb} / ${n.vram_total_gb} GB`,
      `<span class="dim">${ceiling}</span>`,
      `<input type="text" id="dep-lay-${k}" value="0" style="width:60px" onchange="depTotal()" oninput="depTotal()">`,
      busy,
    ];
  });

  const current = chosen.deployed
    ? `<p>сейчас развёрнута на <b>${esc(chosen.backend_type)}</b>: <b>${chosen.placement.mode === "manual"
        ? chosen.placement.stages.map(s => `${esc(s.node_id)}[${s.start_layer}:${s.end_layer}]`).join(" → ")
        : "auto (брокер выбирает сам)"}</b>
       <button class="action danger" onclick="undeployModel('${esc(chosen.model_id)}')">снять</button></p>`
    : `<p class="dim">не развёрнута</p>`;

  return `<h2>Deploy — ручная раскладка по нодам</h2>
    <p>модель <select id="dep-model" onchange="refresh({reset:true})">${options}</select>
       бэкенд <select id="dep-backend" onchange="depTotal()">${backends}</select>
       <span class="dim">${chosen.num_layers} слоёв · param_mem_ratio ${data.param_mem_ratio}</span></p>
    ${current}
    <p><button class="action" onclick="depEven()">разделить поровну между отмеченными</button>
       <button class="action" onclick="depDeploy()">развернуть</button>
       <button class="action" onclick="depDeploy(true)">развернуть, игнорируя оценку VRAM</button></p>
    <p id="dep-total" class="dim">отметьте ноды и укажите слои</p>
    <pre id="dep-out" class="muted">${esc(depMsg)}</pre>` +
    table(["","№","node","GPU · VRAM свободно","влезет слоёв","слоёв","состояние"], rows);
}

function depSelected() {
  // Checked nodes, in the stage order the operator typed. Order is not
  // cosmetic: stage 0 owns the embeddings and answers clients, so on nodes of
  // different speed it decides which card carries them.
  return depNodeIds
    .map(id => {
      const k = depKey(id);
      const on = document.querySelector("#dep-on-" + k);
      if (!on || !on.checked) return null;
      const layers = parseInt((document.querySelector("#dep-lay-" + k) || {}).value, 10);
      const order = parseFloat((document.querySelector("#dep-ord-" + k) || {}).value);
      return {node_id: id, layers: isNaN(layers) ? 0 : layers, order: isNaN(order) ? 999 : order};
    })
    .filter(Boolean)
    .sort((a, b) => a.order - b.order);
}

function depModelLayers() {
  const sel = document.querySelector("#dep-model");
  if (!sel) return 0;
  const text = sel.options[sel.selectedIndex].textContent;
  const match = text.match(/—\s*(\d+)\s*слоёв/);
  return match ? parseInt(match[1], 10) : 0;
}

function depTotal() {
  const el = document.querySelector("#dep-total");
  if (!el) return;
  const picked = depSelected();
  const total = depModelLayers();
  if (!picked.length) { el.className = "dim"; el.textContent = "отметьте ноды и укажите слои"; return; }
  const sum = picked.reduce((a, s) => a + s.layers, 0);
  const chain = picked.map(s => `${s.node_id}=${s.layers}`).join(" + ");
  const backendEl = document.querySelector("#dep-backend");
  const backend = backendEl ? backendEl.value : "";
  if (picked.length > 1 && depSplittable[backend] === false) {
    el.className = "bad";
    el.textContent = `бэкенд ${backend} обслуживает модель только целиком — ` +
      `на ${picked.length} нод его не разложить. Выберите shard или vllm_shard`;
    return;
  }
  if (sum === total) { el.className = "ok"; el.textContent = `${chain} = ${sum} из ${total} ✓`; }
  else { el.className = "bad"; el.textContent = `${chain} = ${sum}, а нужно ровно ${total}`; }
}

function depEven() {
  const picked = depSelected();
  const total = depModelLayers();
  if (!picked.length || !total) return;
  const base = Math.floor(total / picked.length), extra = total % picked.length;
  picked.forEach((s, i) => {
    const el = document.querySelector("#dep-lay-" + depKey(s.node_id));
    if (el) el.value = base + (i < extra ? 1 : 0);
  });
  depTotal();
}

async function depDeploy(force) {
  const sel = document.querySelector("#dep-model");
  const picked = depSelected();
  if (!sel || !picked.length) { depMsg = "отметьте хотя бы одну ноду"; document.querySelector("#dep-out").textContent = depMsg; return; }
  depMsg = "разворачиваю… (первый запуск скачивает веса, это долго)";
  document.querySelector("#dep-out").textContent = depMsg;
  try {
    const backendEl = document.querySelector("#dep-backend");
    const r = await api("/admin/deploy", {method:"POST", body: JSON.stringify({
      model_id: sel.value,
      backend_type: backendEl ? backendEl.value : undefined,
      stages: picked.map(s => ({node_id: s.node_id, layers: s.layers})),
      force: !!force,
    })});
    depMsg = "развёрнута на " + (r.placement.backend_type || "бэкенде из каталога") + ": " +
      r.placement.stages
        .map(s => `${s.node_id}[${s.start_layer}:${s.end_layer}] (${s.layers} слоёв)`).join(" → ");
  } catch (e) { depMsg = "ошибка: " + e.message; }
  document.querySelector("#dep-out").textContent = depMsg;
  refresh();
}

async function undeployModel(id) {
  try {
    await api("/admin/deploy/" + encodeURIComponent(id), {method:"DELETE"});
    depMsg = "снята: " + id;
  } catch (e) { depMsg = "ошибка: " + e.message; }
  refresh();
}

async function viewKeys() {
  const conn = await api("/admin/connect");
  const data = await api("/admin/keys");
  COPY.cmd = localStorage.getItem("loom_last_key_only_cmd") || "";
  COPY.key = lastKeyRaw;
  COPY.addr = conn.dial_address || "";
  const rows = (data.keys || []).map(k => [
    esc(k.key_id),
    esc(k.label || "—"),
    esc(k.address),
    k.max_nodes ? k.max_nodes : `<span class="dim">∞</span>`,
    k.nodes.length ? k.nodes.map(esc).join("<br>") : `<span class="dim">unused</span>`,
    k.revoked ? `<span class="bad">revoked</span>` : `<span class="ok">active</span>`,
    k.revoked ? "" : `<button class="action danger" onclick="revokeKey('${esc(k.key_id)}')">revoke</button>`,
  ]);
  const sev = conn.severity || (conn.warning ? "warn" : "ok");
  const cls = {ok:"ok", info:"warn", warn:"bad"}[sev] || "dim";
  const icon = {ok:"✓", info:"ℹ", warn:"⚠"}[sev] || "";
  const status = conn.note
    ? `<p class="${cls}">${icon} ${esc(conn.note)}</p>`
    : `<p class="ok">✓ адрес доступен воркерам</p>`;
  const check = {true:"TCP-проверка прошла", false:"TCP-проверка не прошла",
                 null:"TCP-проверка не выполнялась"}[String(conn.self_check)];
  return `<h2>Адрес подключения воркеров</h2>
    <p>воркеры звонят на <b>${esc(conn.dial_address)}</b>
       <button class="action" onclick="copyFrom('addr', this)">copy</button>
       <span class="dim">(источник: ${esc(conn.source)}${conn.source === "env" ? " — задан вами в .env" : " — определён автоматически"}; ${esc(check || "")})</span></p>
    ${status}
    <h2>Join keys — всё, что нужно владельцу GPU</h2>
    <p><input id="k-label" type="text" placeholder="label, e.g. gpu-box-1">
       <input id="k-max" type="text" placeholder="max nodes (blank = ∞)" style="width:170px">
       <button class="action" onclick="issueKey()">issue key</button>
       ${lastKeyRaw ? `<button class="action" onclick="copyFrom('cmd', this)">copy команду</button>
         <button class="action" onclick="copyFrom('key', this)">copy только ключ</button>` : ""}</p>
    ${lastKeyRaw

    <pre id="c-out" class="muted">—</pre>

async function sendChat() {
  const out = $("#c-out");
  out.textContent = "…";
  $("#c-stats").innerHTML = "";
  const body = {model: $("#c-model").value, stream: $("#c-stream").checked,
                messages: [{role:"user", content: $("#c-prompt").value}]};
  const maxTok = parseInt($("#c-maxtok").value, 10);
  if (maxTok > 0) body.max_tokens = maxTok;
  // Reasoning models burn hundreds of tokens inside <think> before answering.
  const noThink = $("#c-nothink").checked;
  if (noThink) body.chat_template_kwargs = {enable_thinking: false};

  // Client-side clock. The server reports its own numbers; the difference
  // between the two is what the API hop plus the worker tunnel cost.
  const t0 = performance.now();
  let firstChunkAt = null, chunkTimes = [], text = "", reason = null;
  let usage = null, timings = null;
  try {
    const r = await fetch("/v1/chat/completions", {method:"POST", headers: headers(), body: JSON.stringify(body)});
    if (body.stream) {
      if (!r.ok) { out.textContent = JSON.stringify(await r.json().catch(() => ({})), null, 2); return; }
      // Render the stream as text, the way a chat looks — not as raw SSE frames.
      out.textContent = "";
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        // SSE events are separated by a blank line; a chunk can split one in
        // half, so keep the unterminated tail for the next read.
        const events = buf.split("\n\n");
        buf = events.pop();
        for (const ev of events) {
          for (const line of ev.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;
            try {
              const frame = JSON.parse(payload);
              const choice = (frame.choices || [])[0] || {};
              if (choice.delta && choice.delta.content) {
                const now = performance.now();
                if (firstChunkAt === null) firstChunkAt = now;
                chunkTimes.push(now);
                text += choice.delta.content;
              }
              if (choice.finish_reason) reason = choice.finish_reason;
              if (frame.usage) usage = frame.usage;        // closing chunk
              if (frame.timings) timings = frame.timings;  // closing chunk
            } catch (e) { /* a frame we cannot parse is not worth breaking the view */ }
          }
        }
        out.textContent = text;  // grows live, like a chat
      }
      if (reason) out.textContent = text + reasonNote(reason);
    } else {
      const j = await r.json();
      if (r.ok && j.choices) {
        reason = j.choices[0].finish_reason;
        text = j.choices[0].message.content;
        usage = j.usage || null;
        timings = j.timings || null;
        out.textContent = text + reasonNote(reason);
      } else {
        out.textContent = JSON.stringify(j, null, 2);
        return;
      }
    }
  } catch (e) { out.textContent = "error: " + e.message; return; }

  const totalMs = performance.now() - t0;
  const run = buildRun({body, noThink, totalMs, firstChunkAt, t0, chunkTimes, usage, timings, reason, text});
  lastRun = run;  // full resolution, for the single-run export
  $("#c-stats").innerHTML = renderRunStats(run);
  pushRun(run);
  $("#c-hist").innerHTML = renderHistory();
}

function reasonNote(reason) {
  // "length" means the cap cut the answer off, not that the model stopped.
  return reason === "length"
    ? `\n\n⚠ finish_reason=length — ответ обрезан лимитом max_tokens, поднимите его`
    : `\n\nfinish_reason=${reason}`;
}

// ---------------------------------------------------------------- run stats
function pct(sorted, q) {
  if (!sorted.length) return 0;
  return sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))];
}

function buildRun({body, noThink, totalMs, firstChunkAt, t0, chunkTimes, usage, timings, reason, text}) {
  // Gaps between streamed tokens as the client saw them (empty for non-stream).
  const gaps = [];
  for (let i = 1; i < chunkTimes.length; i++) gaps.push(chunkTimes[i] - chunkTimes[i-1]);
  const sortedGaps = gaps.slice().sort((a,b) => a-b);
  const clientTtft = firstChunkAt === null ? null : firstChunkAt - t0;
  // Prefer the server's token count; fall back to counting stream chunks.
  const completion = usage ? usage.completion_tokens : chunkTimes.length;
  const decodeMs = clientTtft === null ? null : totalMs - clientTtft;
  return {
    at: Date.now(),
    model: body.model,
    stream: !!body.stream,
    noThink,
    maxTokens: body.max_tokens || null,
    reason,
    chars: text.length,
    promptTokens: usage ? usage.prompt_tokens : null,
    completionTokens: completion,
    totalMs,
    clientTtftMs: clientTtft,
    // Steady-state speed: prefill excluded, which is the number worth comparing.
    // Needs a real decode window: a backend that flushes every chunk at once
    // (the echo stub, a proxy that buffers) would otherwise report thousands
    // of tokens/s, which is a measurement artefact, not a speed.
    clientDecodeTps: (decodeMs && decodeMs >= 5 && completion > 1)
      ? ((completion - 1) / (decodeMs / 1000)) : null,
    clientTps: totalMs > 0 && completion ? completion / (totalMs / 1000) : null,
    gapP50: pct(sortedGaps, 0.5),
    gapP95: pct(sortedGaps, 0.95),
    gaps,
    server: timings || null,
    series: runSeries(timings, chunkTimes, t0),
  };
}

// One shape for the charts and the export, whatever measured it.
//
// The head stage's own series is preferred and is the honest one: it times
// each token where it is produced. The client's is a fallback for backends
// that send no timings — and it measures something slightly different, because
// several tokens can arrive in one network chunk, which flattens the cadence.
// `source` says which is which, so an exported file is never ambiguous.
function runSeries(timings, chunkTimes, t0) {
  const s = timings && timings.series;
  if (s && s.t_ms && s.t_ms.length > 1) {
    return {
      source: "head-stage",
      everyNTokens: s.every_n_tokens || 1,
      tokens: s.tokens || s.t_ms.length,
      t_ms: s.t_ms,
      gap_ms: s.gap_ms,
      head_ms: s.head_ms || [],
      peer_ms: s.peer_ms || [],
      wire_ms: s.wire_ms || [],
    };
  }
  if (chunkTimes.length > 1) {
    const t = chunkTimes.map(x => Math.round((x - t0) * 10) / 10);
    const gap = t.map((v, i) => i === 0 ? v : Math.round((t[i] - t[i-1]) * 100) / 100);
    return {source: "client-chunks", everyNTokens: 1, tokens: t.length,
            t_ms: t, gap_ms: gap, head_ms: [], peer_ms: [], wire_ms: []};
  }
  return null;
}

// Instantaneous rate, token by token. A gap of 200 ms is 5 tok/s at that
// moment; averaging the whole request hides everything that varies.
function seriesRates(series) {
  const n = series.everyNTokens || 1;
  // Index 0 is the prefill, whose "rate" is not a decode rate at all.
  return series.gap_ms.slice(1).map(g => g > 0 ? (1000 * n) / g : 0);
}

// A per-token rate is jagged even on a perfectly steady pipeline, so the raw
// line is drawn faintly and a centred moving average is drawn over it. The
// window scales with the run: a fixed one either erases a short answer or
// leaves a long one unreadable.
function smoothed(values, window) {
  const w = window || Math.max(3, Math.round(values.length / 25));
  const half = Math.floor(w / 2);
  return values.map((_, i) => {
    const from = Math.max(0, i - half), to = Math.min(values.length, i + half + 1);
    let sum = 0;
    for (let j = from; j < to; j++) sum += values[j];
    return sum / (to - from);
  });
}

function ms(v) { return v === null || v === undefined ? "—" : (v >= 1000 ? (v/1000).toFixed(2) + " s" : v.toFixed(0) + " ms"); }
function num(v, d) { return v === null || v === undefined ? "—" : v.toFixed(d === undefined ? 1 : d); }

function card(label, value, hint) {
  return `<div style="border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:120px">
    <div class="muted">${label}</div>
    <div style="font-size:17px;color:var(--acc)">${value}</div>
    ${hint ? `<div class="muted">${hint}</div>` : ""}</div>`;
}


// ------------------------------------------------------------------ charts
// A sparkline is enough to spot a spike; reading a rate off one is not
// possible. These carry axes, because the question here is "how many tok/s at
// second 12", not "is the shape bumpy".
function lineChart(sets, {xs, yLabel, xLabel, height}) {
  const w = 760, h = height || 200, padL = 46, padR = 10, padT = 10, padB = 26;
  const all = sets.flatMap(s => s.values).filter(v => isFinite(v));
  if (!all.length || xs.length < 2) return "";
  const yMax = Math.max(...all) * 1.08 || 1;
  const xMax = Math.max(...xs) || 1;
  const px = v => padL + (v / xMax) * (w - padL - padR);
  const py = v => h - padB - (Math.max(0, v) / yMax) * (h - padT - padB);

  const ticksY = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const v = yMax * f, y = py(v);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}"
              stroke="var(--line)" stroke-width="0.5"/>
            <text x="${padL - 6}" y="${(y + 3.5).toFixed(1)}" text-anchor="end"
              font-size="9" fill="var(--muted)">${v >= 10 ? v.toFixed(0) : v.toFixed(1)}</text>`;
  }).join("");
  const ticksX = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const v = xMax * f, x = px(v);
    return `<text x="${x.toFixed(1)}" y="${h - 8}" text-anchor="middle"
              font-size="9" fill="var(--muted)">${(v / 1000).toFixed(1)}s</text>`;
  }).join("");
  const lines = sets.map(s => {
    const pts = s.values.map((v, i) =>
      `${px(xs[i]).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${s.color}"
              stroke-width="${s.width || 1.5}" opacity="${s.opacity || 1}"/>`;
  }).join("");
  const legend = sets.filter(s => s.label).map((s, i) =>
    `<g transform="translate(${padL + 6 + i * 132}, ${padT + 8})">
       <line x1="0" y1="0" x2="14" y2="0" stroke="${s.color}" stroke-width="2"
         opacity="${s.opacity || 1}"/>
       <text x="19" y="3.5" font-size="10" fill="var(--muted)">${esc(s.label)}</text></g>`).join("");

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto;
      background:var(--panel);border:1px solid var(--line);border-radius:6px">
      ${ticksY}${ticksX}
      <text x="10" y="${padT + 4}" font-size="9" fill="var(--muted)">${esc(yLabel)}</text>
      <text x="${w - padR}" y="${h - 8}" text-anchor="end" font-size="9"
        fill="var(--muted)">${esc(xLabel || "время запроса")}</text>
      ${lines}${legend}
    </svg>`;
}

function renderSeriesCharts(run) {
  const s = run.series;
  if (!s || !s.t_ms || s.t_ms.length < 3) return "";
  const rates = seriesRates(s);
  const xs = s.t_ms.slice(1);              // drop the prefill point
  if (rates.length < 2) return "";
  // Tokens divided by the time they took — NOT the mean of the per-token
  // rates. Averaging rates weights a 1 ms token the same as a 100 ms one and
  // comes out higher than the request actually ran; this line has to agree
  // with the tokens/s card above it or one of the two is lying.
  const n = s.everyNTokens || 1;
  const decodeMs = s.gap_ms.slice(1).reduce((a, b) => a + b, 0);
  const avg = decodeMs > 0 ? (1000 * n * rates.length) / decodeMs : 0;

  const rateChart = lineChart([
    {values: rates, color: "var(--acc)", width: 1, opacity: 0.28, label: "мгновенно"},
    {values: smoothed(rates), color: "var(--ok)", width: 2, label: "скользящее среднее"},
    {values: rates.map(() => avg), color: "var(--muted)", width: 1, opacity: 0.6,
     label: `за весь прогон ${avg.toFixed(2)}`},
  ], {xs, yLabel: "tok/s", xLabel: "время от начала запроса"});

  // The split is only worth drawing when the head stage reported it; the
  // client's own clock cannot see inside a pipeline.
  let splitChart = "";
  if (s.head_ms.length > 1) {
    const drop = a => a.slice(1);
    splitChart = `<h2 style="margin-top:16px">Из чего складывается токен (ms)</h2>` +
      lineChart([
        {values: smoothed(drop(s.head_ms)), color: "var(--acc)", width: 1.6, label: "свои слои"},
        {values: smoothed(drop(s.peer_ms)), color: "var(--warn)", width: 1.6, label: "остальные стадии"},
        {values: smoothed(drop(s.wire_ms)), color: "var(--ok)", width: 1.6, label: "транспорт"},
      ], {xs, yLabel: "ms", xLabel: "время от начала запроса", height: 170}) +
      `<p class="muted">сглажено; сумма трёх линий — это интервал между токенами</p>`;
  }

  const sampled = (s.everyNTokens || 1) > 1
    ? ` <span class="warn">точки прорежены: 1 на ${s.everyNTokens} токенов</span>` : "";
  const origin = s.source === "head-stage"
    ? "замерено головой пайплайна"
    : "замерено клиентом по чанкам стрима — несколько токенов могут прийти одной пачкой";

  return `<h2 style="margin-top:16px">Скорость по ходу генерации</h2>
    ${rateChart}
    <p class="muted">${origin}${sampled}</p>
    ${splitChart}`;
}

// ------------------------------------------------------------------ export
// The charts answer the questions this UI thought to ask. Handing over the
// numbers themselves is what lets somebody ask a different one — overlay two
// runs, compare a three-node split against a two-node one, plot it elsewhere.
function downloadJson(filename, payload) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function runStamp(run) {
  const d = new Date(run.at);
  const two = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${two(d.getMonth()+1)}${two(d.getDate())}-` +
         `${two(d.getHours())}${two(d.getMinutes())}${two(d.getSeconds())}`;
}

function exportRun(run) {
  return {
    schema: "loom.run.v1",
    at: new Date(run.at).toISOString(),
    model: run.model,
    stages: run.server ? run.server.stages : null,
    pipeline_id: run.server ? run.server.pipeline_id : null,
    stream: run.stream,
    no_think: run.noThink,
    max_tokens: run.maxTokens,
    finish_reason: run.reason,
    prompt_tokens: run.promptTokens,
    completion_tokens: run.completionTokens,
    client: {
      total_ms: run.totalMs,
      ttft_ms: run.clientTtftMs,
      decode_tokens_per_s: run.clientDecodeTps,
      tokens_per_s: run.clientTps,
    },
    server: run.server || null,
    // Parallel arrays, index-aligned. Index 0 is the prefill: gap_ms[0] is the
    // time to first token, not a decode interval.
    series: run.series || null,
  };
}

function exportLastRun() {
  if (!lastRun) return;
  downloadJson(`loom-run-${runStamp(lastRun)}.json`, exportRun(lastRun));
}

function exportAllRuns() {
  const runs = loadRuns();
  if (!runs.length) return;
  downloadJson(`loom-runs-${runStamp(runs[0])}.json`, {
    schema: "loom.runs.v1",
    exported_at: new Date().toISOString(),
    runs: runs.map(exportRun),
  });
}

function renderRunStats(run) {
  const s = run.server;
  // The head stage's number, not the client's, for the same reason the
  // inter-token figures below prefer it: several tokens can arrive in one
  // network chunk, which shortens the decode window the client can see and
  // inflates its rate. On a slow pipeline the two agree; on a fast one the
  // client reads high — and it would then disagree with the chart underneath,
  // which is plotted from the head's own series.
  const tps = s ? s.decode_tokens_per_s : run.clientDecodeTps;
  const ttft = run.clientTtftMs !== null ? run.clientTtftMs : (s ? s.ttft_ms : null);
  const cards = [
    card("tokens/s (decode)", num(tps, 2),
         s ? "без prefill · голова" : "без prefill · клиент"),
    card("TTFT", ms(ttft), "до первого токена"),
    card("время ответа", ms(run.totalMs), run.stream ? "клиент, весь стрим" : "клиент, весь запрос"),
    card("токенов", `${run.completionTokens ?? "—"}`,
         run.promptTokens !== null ? `prompt ${run.promptTokens}` : "по чанкам стрима"),
    card("tokens/s (e2e)", num(run.clientTps, 2), "включая prefill"),
    // Server numbers first: several tokens can share one network chunk, so the
    // client's own gaps understate the cadence and overstate its spread.
    card("между токенами",
         s ? `${num(s.inter_token_ms_p50)} / ${num(s.inter_token_ms_p95)} ms`
           : (run.gaps.length ? `${num(run.gapP50)} / ${num(run.gapP95)} ms` : "—"),
         s ? "p50 / p95 · голова" : "p50 / p95 · клиент"),
  ];
  let serverBlock = "";
  if (s) {
    // The gap between the two clocks is the API hop + the worker tunnel.
    const overhead = run.totalMs - s.total_ms;
    const perHop = s.stages > 1 ? s.inter_token_ms_p50 / s.stages : null;
    // Measured split, not arithmetic: every stage reports its own duration and
    // the head subtracts them from the round trip it timed itself.
    const split = s.transport_ms_p50 !== undefined ? `
      <p style="margin-top:6px">на что уходит токен (p50 / p95):
        <span class="dim">свои слои</span> ${num(s.head_compute_ms_p50)} / ${num(s.head_compute_ms_p95)} ms ·
        <span class="dim">остальные стадии</span> ${num(s.peer_compute_ms_p50)} / ${num(s.peer_compute_ms_p95)} ms ·
        <span class="${s.transport_share > 0.4 ? "bad" : "acc"}">транспорт</span>
        ${num(s.transport_ms_p50)} / ${num(s.transport_ms_p95)} ms
        <b>(${Math.round(100 * s.transport_share)}% времени)</b></p>` : "";
    serverBlock = `<p class="muted" style="margin-top:10px">по данным головы пайплайна:
      prefill ${ms(s.ttft_ms)} (${num(s.prompt_tokens_per_s)} tok/s) ·
      decode ${ms(s.decode_ms)} (${num(s.decode_tokens_per_s, 2)} tok/s) ·
      между токенами p50 ${num(s.inter_token_ms_p50)} / p95 ${num(s.inter_token_ms_p95)} / max ${num(s.inter_token_ms_max)} ms ·
      стадий ${s.stages}${perHop ? ` (≈ ${num(perHop)} ms на переход)` : ""} ·
      накладные транспорта ${ms(Math.max(0, overhead))}</p>${split}`;
  } else {
    serverBlock = `<p class="muted" style="margin-top:10px">бэкенд не прислал timings —
      цифры измерены клиентом (vLLM-бэкенд или старый образ воркера)</p>`;
  }
  const spark = run.gaps.length > 1
    ? `<h2 style="margin-top:16px">Приход токенов клиенту (ms между чанками)</h2>${sparkline(run.gaps)}`
    : "";
  const download = run.series
    ? `<button class="action" style="margin-left:8px;padding:2px 8px"
         onclick="exportLastRun()">скачать JSON</button>` : "";
  return `<h2 style="margin-top:16px">Статистика запроса${download}</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${cards.join("")}</div>
    ${serverBlock}${renderSeriesCharts(run)}${spark}`;
}

// ------------------------------------------------------------------ charts
function sparkline(values) {
  const w = 620, h = 70, pad = 4;
  const max = Math.max(...values), min = Math.min(...values);
  const span = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i / Math.max(1, values.length - 1)) * (w - 2*pad);
    const y = h - pad - ((v - min) / span) * (h - 2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:${h}px;
      background:var(--panel);border:1px solid var(--line);border-radius:6px">
      <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="1.5"/>
    </svg>
    <p class="muted">мин ${num(min)} · медиана ${num(pct(values.slice().sort((a,b)=>a-b), 0.5))} ·
       макс ${num(max)} ms · ${values.length} интервалов</p>`;
}

function barChart(rows, unit, colorVar) {
  // Horizontal bars: labels stay readable however long the model id is.
  // A run with nothing measurable (non-streamed, old worker image) gets an
  // empty bar and a dash — not a zero, which would read as "it was that slow".
  const values = rows.map(r => r.value).filter(v => v !== null && v !== undefined);
  const max = Math.max(...values, 0.0001);
  return `<div style="display:flex;flex-direction:column;gap:3px;margin:6px 0 14px">` +
    rows.map(r => {
      const has = r.value !== null && r.value !== undefined;
      const width = has ? (100 * r.value / max).toFixed(1) : 0;
      return `<div style="display:flex;align-items:center;gap:8px">
      <span class="muted" style="width:160px;text-align:right;flex:none">${esc(r.label)}</span>
      <span style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:4px;height:16px">
        <span style="display:block;height:100%;width:${width}%;
              background:var(${colorVar});border-radius:3px"></span></span>
      <span style="width:110px;flex:none">${has ? num(r.value, 2) + " " + unit : "<span class=\'dim\'>—</span>"}</span>
    </div>`;
    }).join("") + `</div>`;
}

// ---------------------------------------------------------------- history
const HIST_KEY = "loom_console_runs";
function loadRuns() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch (e) { return []; }
}
let lastRun = null;
// Points kept per stored run. The full series stays in memory for the run on
// screen; history keeps enough shape to overlay runs against each other
// without 20 of them filling the localStorage quota.
const HIST_SERIES_POINTS = 400;

function thinSeries(series, limit) {
  if (!series || !series.t_ms || series.t_ms.length <= limit) return series;
  const step = Math.ceil(series.t_ms.length / limit);
  const take = a => (a && a.length) ? a.filter((_, i) => i % step === 0) : [];
  return {
    ...series,
    everyNTokens: (series.everyNTokens || 1) * step,
    t_ms: take(series.t_ms), gap_ms: take(series.gap_ms),
    head_ms: take(series.head_ms), peer_ms: take(series.peer_ms),
    wire_ms: take(series.wire_ms),
  };
}

function pushRun(run) {
  // The raw client gap series is per-run detail the history does not use.
  const {gaps, ...slim} = run;
  slim.series = thinSeries(run.series, HIST_SERIES_POINTS);
  const runs = loadRuns();
  runs.unshift(slim);
  // A quota error must not cost the user their history: drop the oldest runs
  // until it fits rather than failing the write.
  for (let keep = Math.min(20, runs.length); keep >= 1; keep--) {
    try {
      localStorage.setItem(HIST_KEY, JSON.stringify(runs.slice(0, keep)));
      return;
    } catch (e) { /* quota: try again with fewer runs */ }
  }
}
function clearRuns() { localStorage.removeItem(HIST_KEY); $("#c-hist").innerHTML = renderHistory(); }

function runLabel(r) {
  const when = new Date(r.at).toLocaleTimeString();
  return `${when} ${r.model}${r.noThink ? " ·no-think" : ""}${r.stream ? " ·stream" : ""}`;
}

function renderHistory() {
  const runs = loadRuns();
  if (!runs.length) {
    return `<h2 style="margin-top:20px">История прогонов</h2>
            <p class="muted">пусто — отправьте запрос, и здесь появится сравнение</p>`;
  }
  const pick = (client, serverKey) => runs.map(r => {
    const own = r[client];
    if (own !== null && own !== undefined) return {label: runLabel(r), value: own};
    return {label: runLabel(r), value: r.server ? r.server[serverKey] : null};
  });
  // Same clock as the cards and the charts, so a run compared here is the run
  // that was reported above.
  const tps = runs.map(r => ({
    label: runLabel(r),
    value: r.server ? r.server.decode_tokens_per_s : r.clientDecodeTps,
  }));
  const ttft = pick("clientTtftMs", "ttft_ms");
  const rows = runs.map(r => [
    new Date(r.at).toLocaleTimeString(),
    esc(r.model) + (r.noThink ? ` <span class="dim">no-think</span>` : "") +
      (r.stream ? ` <span class="dim">stream</span>` : ""),
    `${r.completionTokens ?? "—"}${r.promptTokens !== null && r.promptTokens !== undefined ? ` <span class="dim">+${r.promptTokens} prompt</span>` : ""}`,
    num(r.server ? r.server.decode_tokens_per_s : r.clientDecodeTps, 2),
    ms(r.clientTtftMs),
    ms(r.totalMs),
    r.server ? `${num(r.server.inter_token_ms_p50)} / ${num(r.server.inter_token_ms_p95)}` : "—",
    r.server ? r.server.stages : "—",
    r.reason === "length" ? `<span class="warn">length</span>` : `<span class="dim">${esc(r.reason || "—")}</span>`,
  ]);
  return `<h2 style="margin-top:20px">Сравнение прогонов
      <button class="action" style="margin-left:8px;padding:2px 8px"
        onclick="exportAllRuns()">скачать все JSON</button>
      <button class="action danger" style="margin-left:4px;padding:2px 8px" onclick="clearRuns()">очистить</button></h2>
    <p class="muted">в JSON — ряды по токенам всех прогонов, чтобы накладывать их друг на друга</p>
    <p class="muted">tokens/s (decode) — больше лучше</p>${barChart(tps, "tok/s", "--ok")}
    <p class="muted">TTFT — меньше лучше</p>${barChart(ttft, "ms", "--warn")}
    ` + table(["время","модель","токенов","tok/s","TTFT","всего","между токенами p50/p95","стадий","finish"], rows);
}

// ------------------------------------------------------------------ refresh
const VIEWS = {"Nodes":viewNodes, "Models":viewModels, "Deploy":viewDeploy, "Keys":viewKeys,
               "Perf-map":viewPerfmap, "SLO / Rebalance":viewSlo, "Console":viewConsole};
let timer = null;

function isEditing() {
  // Is the user in a field right now? Re-rendering under their hands wipes a
  // half-typed model name and snaps the dropdown back to its first option.
  const el = document.activeElement;
  if (!el || !el.closest || !el.closest("#view")) return false;
  return ["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName);
}

function formSnapshot() {
  // Values keyed by element id, so they survive the innerHTML swap. Switching
  // tabs is safe on its own: the ids of another view simply do not match.
  const state = {};
  document.querySelectorAll("#view input, #view select, #view textarea").forEach(el => {
    if (!el.id) return;
    state[el.id] = el.type === "checkbox" ? el.checked : el.value;
  });
  return state;
}

function restoreForm(state) {
  document.querySelectorAll("#view input, #view select, #view textarea").forEach(el => {
    if (!el.id || !(el.id in state)) return;
    if (el.type === "checkbox") el.checked = state[el.id];
    else el.value = state[el.id];
  });
}

async function refresh(options) {
  const opts = options || {};
  clearTimeout(timer);
  // The auto-refresh must never fight the user for the keyboard.
  if (opts.auto && isEditing()) {
    $("#refreshed").textContent = "· пауза (ввод)";
    timer = setTimeout(() => refresh({auto: true}), 3000);
    return;
  }
  try {
    $("#err").textContent = "";
    const carried = opts.reset ? {} : formSnapshot();
    $("#view").innerHTML = await VIEWS[active]();
    restoreForm(carried);
    if (active === "Deploy") depTotal();  // the line is derived from the inputs
    $("#refreshed").textContent = "· " + new Date().toLocaleTimeString();
  } catch (e) { $("#err").textContent = e.message; }
  if (active !== "Console") timer = setTimeout(() => refresh({auto: true}), 3000);
}
renderTabs();
refresh();
</script>
