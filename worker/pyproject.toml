[project]
name = "loom-worker"
version = "0.0.1"
description = "Loom worker: closed executor of orchestrator push-commands. No planning logic."
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Installed only in GPU images; the worker spawns `vllm serve` as a subprocess.
vllm = ["vllm>=0.8"]
sglang = ["sglang[all]>=0.4"]
# Apple Silicon (native, not docker — Metal cannot be passed into a container).
# Covers both the whole-model `mlx` backend and the `mlx_shard` stage engine.
# Pair it with [p2p] so the node also gets direct links to its neighbours:
#   pip install "./worker[mlx,p2p]"
mlx = ["mlx>=0.21", "mlx-lm>=0.20"]
# NVML-based VRAM watchdog enforcement on CUDA hosts.
cuda = ["nvidia-ml-py>=12.0"]
# Direct worker-to-worker activations (libp2p through Lattica). Optional: the
# agent relays through the orchestrator when it is absent, so an image without
# it is slower on a spread-out pipeline and correct everywhere.
p2p = ["lattica==1.0.21"]

[project.scripts]
loom-worker = "loom_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom_worker"]
