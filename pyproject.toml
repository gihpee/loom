[project]
name = "looma"
version = "0.2.0"
description = "Looma orchestrator — distributed compute and inference on machines nobody can dial"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    # Postgres. Асинхронный драйвер, потому что HTTP-слой асинхронный: с
    # синхронным каждый запрос к базе блокировал бы цикл событий, то есть и
    # все остальные запросы заодно.
    "asyncpg>=0.29",
    "protobuf>=5.29",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Реализация WebSocket для uvicorn. Не роскошь: без неё он отвечает на
    # upgrade-запрос кодом 404 — с предупреждением в лог и без единого намёка
    # на стороне клиента, что дело в отсутствующем пакете, а не в маршруте.
    # Отдельным пакетом, а не uvicorn[standard]: тот тянет uvloop, httptools,
    # watchfiles и PyYAML, ни один из которых здесь не нужен.
    "websockets>=13",
]

[project.optional-dependencies]
# The rendezvous node agents bootstrap to, so they can reach each other
# directly (docs/P2P_TRANSPORT.md). Without it the orchestrator carries every
# message between nodes — correct, and two wide-area crossings instead of one.
p2p = ["lattica==1.0.21"]
grpc-tools = ["grpcio-tools==1.71.0"]

[dependency-groups]
# The integration tests run a real agent and a real model stage in-process, so
# the node's and the payload's dependencies are dev dependencies here.
dev = [
    "pytest>=8.0",
    # Часть проверок учётных записей асинхронна — иначе они проверяли бы
    # заглушку, а не поведение самой базы.
    "pytest-asyncio>=0.24",
    "grpcio-tools==1.71.0",
    "psutil>=5.9",
    "cryptography>=42",
    "torch>=2.2",
    "transformers>=4.44",
    "safetensors>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/looma"]

[tool.pytest.ini_options]
markers = ["slow: runs a real model; minutes, not seconds"]
testpaths = ["tests"]
# `auto`, а не декоратор на каждой: асинхронных проверок будет всё больше, а
# один пропущенный `@pytest_asyncio.fixture` даёт не падение теста, а ошибку в
# внутренностях pytest, по которой не видно ни файла, ни причины.
asyncio_mode = "auto"
