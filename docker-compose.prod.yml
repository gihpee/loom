# Loom orchestrator for real deployments (no workers here — GPU owners attach
# themselves with `docker run gihpee/loomworker --key ...`).
#
#   bash scripts/init_env.sh            # generates .env with random secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Everything configurable lives in .env (see .env.example): ports, tokens,
# catalog, placement ratios. No address to configure — the orchestrator detects
# what workers should dial (src/loom/orchestrator/public_addr.py) and embeds it
# into every join key.
#
# Ports are published as <port>:<port> on purpose: the port number ends up
# inside the join key, so it must be identical inside and outside the container.

services:
  # The springboard for workers behind NAT: it carries a connection for a few
  # seconds so two of them can punch through to each other, then steps out.
  # Not the path activations travel — that is the orchestrator's tunnel, which
  # keeps working whether this runs or not.
  relay:
    build:
      context: .
      dockerfile: docker/relay.Dockerfile
    restart: unless-stopped
    environment:
      LOOM_RELAY_PORT: ${LOOM_P2P_RELAY_PORT:-47200}
      # How the outside world reaches this host. Announced, not detected: the
      # container cannot know which of its addresses a worker can use.
      LOOM_RELAY_PUBLIC_HOST: ${LOOM_P2P_RELAY_PUBLIC_HOST:-}
    ports:
      - "${LOOM_P2P_RELAY_PORT:-47200}:${LOOM_P2P_RELAY_PORT:-47200}/tcp"
    volumes:
      - loom-data:/data

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    restart: unless-stopped
    environment:
      LOOM_MODEL_CATALOG: /app/configs/${LOOM_CATALOG:-catalog-qwen3-8b.json}
      LOOM_HTTP_PORT: ${LOOM_HTTP_PORT:-8000}
      LOOM_GRPC_PORT: ${LOOM_GRPC_PORT:-9000}
      LOOM_PUBLIC_ADDR: ${LOOM_PUBLIC_ADDR:-}
      LOOM_SKIP_IP_LOOKUP: ${LOOM_SKIP_IP_LOOKUP:-}
      LOOM_ADMIN_TOKEN: ${LOOM_ADMIN_TOKEN:-}
      LOOM_NODE_TOKEN: ${LOOM_NODE_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      LOOM_KEYSTORE_PATH: /data/keys.json
      # Direct worker-to-worker activations (docs/P2P_TRANSPORT.md).
      LOOM_P2P: ${LOOM_P2P:-1}
      LOOM_P2P_PORT: ${LOOM_P2P_PORT:-47100}
      # Circuit-relay servers handed to workers. Without one, a worker nothing
      # can dial into has no way to negotiate a direct link and every one of
      # its activations is relayed through this process instead.
      LOOM_P2P_RELAY: ${LOOM_P2P_RELAY:-}
      LOOM_PARAM_MEM_RATIO: ${LOOM_PARAM_MEM_RATIO:-0.6}
      LOOM_KVCACHE_MEM_RATIO: ${LOOM_KVCACHE_MEM_RATIO:-0.3}
      LOOM_QPS_PER_PIPELINE: ${LOOM_QPS_PER_PIPELINE:-10}
      LOOM_REBALANCE_S: ${LOOM_REBALANCE_S:-60}
      LOOM_HEARTBEAT_TIMEOUT_S: ${LOOM_HEARTBEAT_TIMEOUT_S:-45}
      LOOM_START_TIMEOUT_S: ${LOOM_START_TIMEOUT_S:-3600}
      LOOM_DEPLOY_GRACE_S: ${LOOM_DEPLOY_GRACE_S:-60}
      LOOM_DEPLOY_RETRY_S: ${LOOM_DEPLOY_RETRY_S:-300}
      LOOM_SLO_CHECK_S: ${LOOM_SLO_CHECK_S:-10}
      LOOM_SLO_WINDOW_S: ${LOOM_SLO_WINDOW_S:-60}
      LOOM_SLO_MIN_SAMPLES: ${LOOM_SLO_MIN_SAMPLES:-10}
      LOOM_SLO_BOOST: ${LOOM_SLO_BOOST:-2.0}
      LOOM_LOG_LEVEL: ${LOOM_LOG_LEVEL:-INFO}
    ports:
      # client API + admin UI
      - "${LOOM_HTTP_PORT:-8000}:${LOOM_HTTP_PORT:-8000}"
      # control plane + data-plane tunnel (workers dial in)
      - "${LOOM_GRPC_PORT:-9000}:${LOOM_GRPC_PORT:-9000}"
      # p2p rendezvous: the one address workers bootstrap to, so they can then
      # reach EACH OTHER directly instead of relaying activations through this
      # process (docs/P2P_TRANSPORT.md). Both transports: TCP goes through the
      # most middleboxes, QUIC avoids head-of-line blocking. This host is the
      # only one in Loom that needs an inbound port — workers still just dial
      # out. Set LOOM_P2P=0 to turn the whole thing off.
      - "${LOOM_P2P_PORT:-47100}:${LOOM_P2P_PORT:-47100}/tcp"
      - "${LOOM_P2P_PORT:-47100}:${LOOM_P2P_PORT:-47100}/udp"
    volumes:
      - loom-data:/data
    depends_on:
      - redis
      - postgres

  # Optional public entry point for hosts WITHOUT a public IP:
  #   docker compose -f docker-compose.prod.yml --profile tunnel up -d
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tcp", "orchestrator:${LOOM_GRPC_PORT:-9000}", "--log", "stdout"]
    environment:
      # Only needed when running with --profile tunnel.
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - orchestrator

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - loom-redis:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${LOOM_PG_PASSWORD:-loom}
    volumes:
      - loom-pg:/var/lib/postgresql/data
      - ./src/loom/perfmap/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  loom-data:
  loom-redis:
  loom-pg:
